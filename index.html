        27,
        600
      );
      ctx.fillStyle = 'rgba(255, 255, 255, 0.84)';
      ctx.fillText(
        returnPrompt,
        LOGICAL_WIDTH / 2,
        panelY + 478
      );

      ctx.restore();
    }

    function drawVictoryScreen(now) {
      drawBlurredEndBackground();
      drawVictoryFireworks(now);
      drawVictoryMessage(now);
    }

    function showVolumeHud() {
      volumeHudVisibleUntil = performance.now() + VOLUME_HUD_DURATION;
      forceHudRedraw = true;
    }

    function drawRoundedRect(context, x, y, width, height, radius) {
      const safeRadius = Math.min(radius, width / 2, height / 2);

      context.beginPath();
      context.moveTo(x + safeRadius, y);
      context.arcTo(x + width, y, x + width, y + height, safeRadius);
      context.arcTo(
        x + width,
        y + height,
        x,
        y + height,
        safeRadius
      );
      context.arcTo(x, y + height, x, y, safeRadius);
      context.arcTo(x, y, x + width, y, safeRadius);
      context.closePath();
    }

    function drawSketchButtonFrame(
      context,
      rect,
      fillStyle,
      strokeStyle,
      radius = 26
    ) {
      context.save();

      drawRoundedRect(
        context,
        rect.x,
        rect.y,
        rect.width,
        rect.height,
        radius
      );
      context.fillStyle = fillStyle;
      context.fill();
      context.lineWidth = 3.6;
      context.strokeStyle = strokeStyle;
      context.stroke();

      context.globalAlpha = 0.3;
      drawRoundedRect(
        context,
        rect.x + 2,
        rect.y - 1,
        rect.width - 3,
        rect.height + 1,
        Math.max(4, radius - 2)
      );
      context.lineWidth = 1.8;
      context.strokeStyle = strokeStyle;
      context.stroke();
      context.restore();
    }

    function drawSpeakerIcon(context, centerX, centerY, size, muted) {
      const half = size / 2;
      const left = centerX - half;
      const top = centerY - half;

      function traceSpeakerBody(offsetX = 0, offsetY = 0) {
        context.beginPath();
        context.moveTo(left + size * 0.12 + offsetX, top + size * 0.36 + offsetY);
        context.lineTo(left + size * 0.31 + offsetX, top + size * 0.36 + offsetY);
        context.lineTo(left + size * 0.58 + offsetX, top + size * 0.16 + offsetY);
        context.lineTo(left + size * 0.58 + offsetX, top + size * 0.84 + offsetY);
        context.lineTo(left + size * 0.31 + offsetX, top + size * 0.64 + offsetY);
        context.lineTo(left + size * 0.12 + offsetX, top + size * 0.64 + offsetY);
        context.closePath();
      }

      function traceSoundMarks(offsetX = 0, offsetY = 0) {
        if (muted) {
          context.beginPath();
          context.moveTo(left + size * 0.68 + offsetX, top + size * 0.34 + offsetY);
          context.lineTo(left + size * 0.9 + offsetX, top + size * 0.66 + offsetY);
          context.moveTo(left + size * 0.9 + offsetX, top + size * 0.34 + offsetY);
          context.lineTo(left + size * 0.68 + offsetX, top + size * 0.66 + offsetY);
          return;
        }

        context.beginPath();
        context.arc(
          left + size * 0.57 + offsetX,
          centerY + offsetY,
          size * 0.2,
          -Math.PI / 3,
          Math.PI / 3
        );
        context.moveTo(
          left + size * 0.57 + Math.cos(-Math.PI / 3) * size * 0.34 + offsetX,
          centerY + Math.sin(-Math.PI / 3) * size * 0.34 + offsetY
        );
        context.arc(
          left + size * 0.57 + offsetX,
          centerY + offsetY,
          size * 0.34,
          -Math.PI / 3,
          Math.PI / 3
        );
      }

      context.save();
      context.lineCap = 'round';
      context.lineJoin = 'round';
      context.shadowColor = 'rgba(255, 214, 72, 0.65)';
      context.shadowBlur = 10;
      context.fillStyle = '#fff6b3';
      traceSpeakerBody();
      context.fill();

      context.strokeStyle = '#fff6b3';
      context.lineWidth = Math.max(4, size * 0.075);
      traceSoundMarks();
      context.stroke();

      context.shadowBlur = 0;
      context.globalAlpha = 0.34;
      context.strokeStyle = '#5e4128';
      context.lineWidth = Math.max(2, size * 0.032);
      traceSpeakerBody(1.5, -1);
      context.stroke();
      traceSoundMarks(1.5, -1);
      context.stroke();
      context.restore();
    }

    function drawMuteButton() {
      if (state !== STATE_START) {
        return;

      const rect = MUTE_BUTTON_RECT;
      const muted = audioController.isEffectivelyMuted;

      drawSketchButtonFrame(
        hudCtx,
        rect,

      );

      drawSpeakerIcon(
        hudCtx,
        rect.x + rect.width / 2,
        rect.y + rect.height / 2,

        muted
      );

    function drawOrientationIcon(context, centerX, centerY, landscape) {
      const deviceWidth = landscape ? 64 : 42;
      const deviceHeight = landscape ? 42 : 64;
      const left = centerX - deviceWidth / 2;
      const top = centerY - deviceHeight / 2;
      const arrowStart = Math.PI * 0.12;
      const arrowEnd = Math.PI * 0.58;
      const arrowRadius = 47;

      function drawDevice(offsetX = 0, offsetY = 0) {
        drawRoundedRect(
          context,
          left + offsetX,
          top + offsetY,
          deviceWidth,
          deviceHeight,
          9
        );
      }

      function drawArrow(offsetX = 0, offsetY = 0) {
        context.beginPath();
        context.arc(
          centerX + offsetX,
          centerY + offsetY,
          arrowRadius,
          arrowStart,
          arrowEnd
        );
        context.stroke();

        const arrowX = centerX + Math.cos(arrowEnd) * arrowRadius + offsetX;
        const arrowY = centerY + Math.sin(arrowEnd) * arrowRadius + offsetY;
        context.beginPath();
        context.moveTo(arrowX, arrowY);
        context.lineTo(arrowX - 12, arrowY - 3);
        context.lineTo(arrowX - 4, arrowY - 13);
        context.closePath();
        context.fillStyle = context.strokeStyle;
        context.fill();
      }

      context.save();
      context.lineCap = 'round';
      context.lineJoin = 'round';
      context.strokeStyle = orientationRequestInProgress
        ? 'rgba(255, 246, 179, 0.55)'
        : '#fff6b3';
      context.fillStyle = 'rgba(255, 246, 179, 0.16)';
      context.lineWidth = 5;
      context.shadowColor = 'rgba(255, 214, 72, 0.58)';
      context.shadowBlur = orientationRequestInProgress ? 4 : 10;
      drawDevice();
      context.fill();
      context.stroke();
      drawArrow();

      context.globalAlpha = 0.28;
      context.shadowBlur = 0;
      context.strokeStyle = '#5e4128';
      context.lineWidth = 2.2;
      drawDevice(1.5, -1);
      context.stroke();
      drawArrow(1.5, -1);
      context.restore();
    }

    function drawOrientationButton() {

    function getStartFullscreenButtonRect() {

    function drawFullscreenIcon(
      context,
      centerX,
      centerY,
      size,
      active,
      disabled = false
    ) {
      const half = size * 0.38;
      const segment = size * 0.24;
      const direction = active ? -1 : 1;
      const color = disabled ? '#8a887b' : '#fff6b3';

      function traceCorners(offsetX = 0, offsetY = 0) {
        const left = centerX - half + offsetX;
        const right = centerX + half + offsetX;
        const top = centerY - half + offsetY;
        const bottom = centerY + half + offsetY;
        const inset = active ? segment * 0.42 : 0;

        context.beginPath();
        context.moveTo(left + segment * direction + inset, top + inset);
        context.lineTo(left + inset, top + inset);
        context.lineTo(left + inset, top + segment * direction + inset);

        context.moveTo(right - segment * direction - inset, top + inset);
        context.lineTo(right - inset, top + inset);
        context.lineTo(right - inset, top + segment * direction + inset);

        context.moveTo(left + segment * direction + inset, bottom - inset);
        context.lineTo(left + inset, bottom - inset);
        context.lineTo(left + inset, bottom - segment * direction - inset);

        context.moveTo(right - segment * direction - inset, bottom - inset);
        context.lineTo(right - inset, bottom - inset);
        context.lineTo(right - inset, bottom - segment * direction - inset);
      }

      context.save();
      context.lineCap = 'round';
      context.lineJoin = 'round';
      context.strokeStyle = color;
      context.lineWidth = 6;
      context.shadowColor = disabled
        ? 'transparent'
        : 'rgba(255, 214, 72, 0.58)';
      context.shadowBlur = disabled ? 0 : 10;
      traceCorners();
      context.stroke();

      context.globalAlpha = 0.3;
      context.shadowBlur = 0;
      context.strokeStyle = '#5e4128';
      context.lineWidth = 2.4;
      traceCorners(1.5, -1);
      context.stroke();
      context.restore();
    }

    function drawFullscreenButton() {
      if (state !== STATE_START || !fullscreenSupported()) {
        return;

      const rect = getStartFullscreenButtonRect();

    function drawBulbIcon(context, centerX, centerY, size, disabled) {
      function traceBulb(offsetX = 0, offsetY = 0) {
        context.beginPath();
        context.arc(
          centerX + offsetX,
          centerY - size * 0.1 + offsetY,
          size * 0.27,
          Math.PI * 0.15,
          Math.PI * 0.85,
          true
        );
        context.quadraticCurveTo(
          centerX - size * 0.23 + offsetX,
          centerY + size * 0.16 + offsetY,
          centerX - size * 0.12 + offsetX,
          centerY + size * 0.27 + offsetY
        );
        context.lineTo(
          centerX + size * 0.12 + offsetX,
          centerY + size * 0.27 + offsetY
        );
        context.quadraticCurveTo(
          centerX + size * 0.23 + offsetX,
          centerY + size * 0.16 + offsetY,
          centerX + size * 0.27 + offsetX,
          centerY - size * 0.1 + offsetY
        );
        context.closePath();
      }

      function traceBulbBase(offsetX = 0, offsetY = 0) {
        context.beginPath();
        context.moveTo(
          centerX - size * 0.13 + offsetX,
          centerY + size * 0.36 + offsetY
        );
        context.lineTo(
          centerX + size * 0.13 + offsetX,
          centerY + size * 0.36 + offsetY
        );
        context.moveTo(
          centerX - size * 0.09 + offsetX,
          centerY + size * 0.46 + offsetY
        );
        context.lineTo(
          centerX + size * 0.09 + offsetX,
          centerY + size * 0.46 + offsetY
        );
      }

      context.save();
      context.lineCap = 'round';
      context.lineJoin = 'round';
      context.fillStyle = disabled ? '#777768' : '#fff36c';
      context.strokeStyle = disabled ? '#9d9d86' : '#fff36c';
      context.lineWidth = Math.max(4, size * 0.08);
      context.shadowColor = disabled ? 'transparent' : '#fff36c';
      context.shadowBlur = disabled ? 0 : 14;
      traceBulb();
      context.fill();
      traceBulbBase();
      context.stroke();

      context.globalAlpha = 0.3;
      context.shadowBlur = 0;
      context.strokeStyle = disabled ? '#646057' : '#5e4128';
      context.lineWidth = Math.max(2, size * 0.035);
      traceBulb(1.5, -1);
      context.stroke();
      traceBulbBase(1.5, -1);
      context.stroke();
      context.restore();
    }

    function drawPauseIcon(context, centerX, centerY, size, disabled) {
      const barWidth = size * 0.22;
      const barHeight = size * 0.62;
      const gap = size * 0.12;
      const top = centerY - barHeight / 2;
      const leftBarX = centerX - gap / 2 - barWidth;
      const rightBarX = centerX + gap / 2;

      function traceBar(x, direction, offsetX = 0, offsetY = 0) {
        const lean = size * 0.035 * direction;
        context.beginPath();
        context.moveTo(x + lean + offsetX, top + offsetY);
        context.lineTo(x + barWidth + offsetX, top + size * 0.02 + offsetY);
        context.lineTo(
          x + barWidth - lean + offsetX,
          top + barHeight + offsetY
        );
        context.lineTo(x + offsetX, top + barHeight - size * 0.015 + offsetY);
        context.closePath();
      }

      context.save();
      context.lineJoin = 'round';
      context.fillStyle = disabled ? '#9d9d86' : '#fff6b3';
      context.shadowColor = disabled
        ? 'transparent'
        : 'rgba(255, 214, 72, 0.62)';
      context.shadowBlur = disabled ? 0 : 10;
      traceBar(leftBarX, 1);
      context.fill();
      traceBar(rightBarX, -1);
      context.fill();

      context.globalAlpha = 0.32;
      context.shadowBlur = 0;
      context.strokeStyle = disabled ? '#646057' : '#5e4128';
      context.lineWidth = Math.max(2, size * 0.035);
      traceBar(leftBarX, 1, 1.5, -1);
      context.stroke();
      traceBar(rightBarX, -1, 1.5, -1);
      context.stroke();
      context.restore();
    }

    function drawGameControlButtons(now) {

    function getAudioHudSignature(realNow, gameNow) {
      const hintSeconds = state === STATE_GAME &&
        !cleanHudEnabled &&
        gameNow < hintCooldownUntil
        ? Math.ceil((hintCooldownUntil - gameNow) / 1000)
        : 0;
      const tutorialVisible = isHintTutorialVisible(gameNow);

      return [
        state,
        assetsReady ? 1 : 0,
        isPreloading ? 1 : 0,
        loadedAssets,
        loadErrors.length,
        bestTime ?? '',
        audioController.isEffectivelyMuted ? 1 : 0,
        audioController.globalVolume.toFixed(2),
        mobileOrientationButtonAvailable() ? 1 : 0,
        requestedOrientation ?? 'auto',
        surfaceLayout.quarterTurn ? 1 : 0,
        orientationRequestInProgress ? 1 : 0,
        fullscreenSupported() ? 1 : 0,
        isFullscreenActive() ? 1 : 0,
        fullscreenRequestInProgress ? 1 : 0,
        cleanHudEnabled ? 1 : 0,
        cleanHudEnabled &&
          gameNow - cleanHudEnabledAt < HUD_RESTORE_EMPHASIS_DURATION
          ? 1
          : 0,
        realNow < uiNoticeVisibleUntil ? uiNoticeText : '',
        sketchFontReady ? 1 : 0,
        hintSeconds,
        tutorialVisible ? 1 : 0,
        victoryPending ? 1 : 0,
        realNow < volumeHudVisibleUntil ? 1 : 0
      ].join('|');
    }

    function drawAudioHud(realNow, gameNow = getGameNow(realNow)) {
      const popupActive = realNow < volumeHudVisibleUntil;
      const noticeActive = Boolean(uiNoticeText) &&
        realNow < uiNoticeVisibleUntil;
      const restoreTabAnimationActive = state === STATE_GAME &&
        cleanHudEnabled &&
        gameNow - cleanHudEnabledAt < HUD_RESTORE_EMPHASIS_DURATION;
      const hintAnimationActive = state === STATE_GAME &&
        !cleanHudEnabled && (
          gameNow < hintCooldownUntil ||
          isHintTutorialVisible(gameNow)
        );
      const signature = getAudioHudSignature(realNow, gameNow);
      const animationInterval =
        popupActive || noticeActive || hintAnimationActive ||
        restoreTabAnimationActive
          ? 34
          : 100;
      const hasAnimation =
        popupActive || noticeActive || hintAnimationActive ||
        restoreTabAnimationActive;

      if (
        !forceHudRedraw &&
        signature === lastHudSignature &&
        (!hasAnimation || realNow - lastHudRenderAt < animationInterval)
      ) {
        return;
      }

      hudCtx.save();
      hudCtx.setTransform(1, 0, 0, 1, 0, 0);
      hudCtx.clearRect(0, 0, audioHudCanvas.width, audioHudCanvas.height);
      hudCtx.restore();

      if (state === STATE_START) {
        drawMuteButton();
        drawOrientationButton();
        drawFullscreenButton();
      }
      drawGameControlButtons(gameNow);
      drawStartBestTime();
      drawVolumePopup(realNow);
      drawUiNotice(realNow);

      lastHudRenderAt = realNow;
      lastHudSignature = signature;
      forceHudRedraw = false;
    }

    function pointIsInsideMuteButton(point) {
      if (state !== STATE_START) {
        return false;
      }

      return (
        point.x >= MUTE_BUTTON_HIT_RECT.x &&
        point.x <= MUTE_BUTTON_HIT_RECT.x + MUTE_BUTTON_HIT_RECT.width &&
        point.y >= MUTE_BUTTON_HIT_RECT.y &&
        point.y <= MUTE_BUTTON_HIT_RECT.y + MUTE_BUTTON_HIT_RECT.height
      );
    }

    function pointIsInsideOrientationButton(point) {
      if (state !== STATE_START || !mobileOrientationButtonAvailable()) {
        return false;
      }

      return pointIsInsideRect(point, ORIENTATION_BUTTON_HIT_RECT);
    }

    function pointIsInsideFullscreenButton(point) {
      if (
        state !== STATE_START ||
        !fullscreenSupported() ||
        fullscreenRequestInProgress
      ) {
        return false;
      }

      return pointIsInsideRect(point, getStartFullscreenButtonHitRect());
    }

    function pointIsInsideHudRestoreTab(point) {
      return state === STATE_GAME &&
        cleanHudEnabled &&
        pointIsInsideRect(point, HUD_RESTORE_TAB_HIT_RECT);
    }

    function toggleCleanHud() {
      if (state !== STATE_GAME && state !== STATE_PAUSE) {
        return;
      }

      cleanHudEnabled = !cleanHudEnabled;
      cleanHudEnabledAt = cleanHudEnabled ? getGameNow() : 0;
      pauseExitConfirmUntil = 0;
      audioController.playSfx('button');
      forceHudRedraw = true;
    }

    async function requestOrientation(targetOrientation) {
      if (orientationRequestInProgress) {
        return;
      }

      orientationRequestInProgress = true;
      requestedOrientation = targetOrientation;
      forceHudRedraw = true;
      resizeCanvas();

      try {
        if (!isFullscreenActive() && fullscreenSupported()) {
          await setFullscreenActive(true, {
            playSound: false,
            notifyOnFailure: false
          });
        }

        if (
          window.screen.orientation &&
          typeof window.screen.orientation.lock === 'function'
        ) {
          try {
            await window.screen.orientation.lock(targetOrientation);
          } catch {
            // CSS-поворот ниже остаётся рабочим fallback.
          }
        }
      } finally {
        orientationRequestInProgress = false;
        forceHudRedraw = true;
        resizeCanvas();
      }
    }

    function toggleOrientation() {
      const current = selectedOrientation();
      const target = current === 'landscape' ? 'portrait' : 'landscape';
      audioController.playSfx('button');
      void requestOrientation(target);
    }

    function pointIsInsideRect(point, rect) {
      return (
        point.x >= rect.x &&
        point.x <= rect.x + rect.width &&
        point.y >= rect.y &&
        point.y <= rect.y + rect.height
      );
    }

    function useHint(now) {
      if (
        state !== STATE_GAME ||
        victoryPending ||
        now < hintCooldownUntil
      ) {
        return;
      }

      const available = pears.filter(pear => !pear.isFound);

      if (available.length === 0) {
        return;
      }

      const selected = available[
        Math.floor(Math.random() * available.length)
      ];
      dismissHintTutorial();
      hintedPearId = selected.id;
      hintEffectUntil = now + HINT_EFFECT_DURATION;
      hintCooldownUntil = now + HINT_COOLDOWN_MS;
      usedHintThisRound = true;
      penaltyMilliseconds = 0;
      penaltyTexts = [];
      audioController.playSfx('button');
    }

    function drawLoadingScreen() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (loadErrors.length > 0 && !isPreloading) {
        ctx.fillStyle = '#ff6868';
        ctx.font = '700 42px Arial, Helvetica, sans-serif';
        ctx.fillText(
          'Ошибка загрузки ресурсов',
          LOGICAL_WIDTH / 2,
          LOGICAL_HEIGHT / 2 - 100
        );

        ctx.fillStyle = '#ffffff';
        ctx.font = '26px Arial, Helvetica, sans-serif';

        loadErrors.slice(0, 5).forEach((message, index) => {
          ctx.fillText(
            message,
            LOGICAL_WIDTH / 2,
            LOGICAL_HEIGHT / 2 - 38 + index * 38
          );
        });

        ctx.fillStyle = '#f1ff58';
        ctx.font = '700 30px Arial, Helvetica, sans-serif';
        ctx.fillText(
          'Нажмите на экран или Enter, чтобы повторить загрузку',
          LOGICAL_WIDTH / 2,
          LOGICAL_HEIGHT / 2 + 190
        );

        ctx.restore();
        return;
      }

      const totalAssets = LOGICAL_ASSET_COUNT;
      const progress = totalAssets > 0 ? loadedAssets / totalAssets : 1;
      const barWidth = 620;
      const barHeight = 24;
      const barX = (LOGICAL_WIDTH - barWidth) / 2;
      const barY = LOGICAL_HEIGHT / 2 + 32;

      ctx.fillStyle = '#f1ff58';
      ctx.font = '700 42px Arial, Helvetica, sans-serif';
      ctx.fillText(
        `Загрузка ${loadedAssets} / ${totalAssets}`,
        LOGICAL_WIDTH / 2,
        LOGICAL_HEIGHT / 2 - 28
      );

      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.fillRect(barX, barY, barWidth, barHeight);
      ctx.fillStyle = '#f1ff58';
      ctx.fillRect(barX, barY, barWidth * progress, barHeight);
      ctx.restore();
    }

    function render(realNow) {
      const gameNow = getGameNow(realNow);
      syncStartScreenVisibility();

      if (!assetsReady) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
        drawLoadingScreen();
        drawAudioHud(realNow, gameNow);
        requestAnimationFrame(render);
        return;
      }

      if (state === STATE_START) {
        if (!startBackdropPrepared) {
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
          startBackdropPrepared = true;
        }
      } else {
        startBackdropPrepared = false;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
      }

      switch (state) {
        case STATE_START:
          // GIF/PNG отображается HTML-элементом поверх Canvas.
          break;

        case STATE_GAME:
          drawBackground(images.level);

          for (const pear of pears) {
            drawPear(pear, gameNow);
          }

          drawEffects(gameNow);
          drawPenaltyTexts(gameNow);
          drawGameHud(gameNow);

          if (hintedPearId !== null && gameNow >= hintEffectUntil) {
            hintedPearId = null;
          }

          if (victoryPending && gameNow >= victoryTransitionAt) {
            completeVictoryTransition(realNow);
          }
          break;

        case STATE_PAUSE:
          drawBackground(images.level);

          for (const pear of pears) {
            drawPear(pear, gameNow);
          }

          drawEffects(gameNow);
          drawPenaltyTexts(gameNow);
          drawGameHud(gameNow);
          drawPauseOverlay(realNow);
          break;

        case STATE_END:
          drawVictoryScreen(realNow);
          break;

        default:
          returnToStart();
          break;
      }

      drawAudioHud(realNow, gameNow);
      requestAnimationFrame(render);
    }

    function pointHitsPear(point, pear, visualScale = 1) {
      const safeScale = Math.max(0.001, visualScale);
      const dx = point.x - pear.x;
      const dy = point.y - pear.y;
      const cosine = Math.cos(pear.angle);
      const sine = Math.sin(pear.angle);

      // Переводим клик в локальные координаты повёрнутого спрайта.
      // Масштаб учитывает Pop-анимацию найденной груши и подсветку подсказки.
      let localX = (dx * cosine + dy * sine) / safeScale;
      let localY = (-dx * sine + dy * cosine) / safeScale;

      // Вертикальное смещение эллипса повторяет форму груши, поэтому отражения
      // должны применяться так же, как при отрисовке самого спрайта.
      if (pear.flipX) {
        localX *= -1;
      }

      if (pear.flipY) {
        localY *= -1;
      }

      const normalizedX = (localX + pear.width / 2) / pear.width;
      const normalizedY = (localY + pear.height / 2) / pear.height;
      const ellipseX = (normalizedX - 0.5) / 0.58;
      const ellipseY = (normalizedY - 0.52) / 0.60;

      return ellipseX * ellipseX + ellipseY * ellipseY <= 1;
    }

    function findHitPear(point, now, foundState) {
      for (let index = pears.length - 1; index >= 0; index -= 1) {
        const pear = pears[index];

        if (pear.isFound !== foundState) {
          continue;
        }

        const visualScale = pear.isFound
          ? getPopScale(pear, now)
          : getHintScale(pear, now);

        if (pointHitsPear(point, pear, visualScale)) {
          return pear;
        }
      }

      return null;
    }

    function vibrateOnSuccess() {
      if (typeof navigator.vibrate !== 'function') {
        return;
      }

      try {
        navigator.vibrate(50);
      } catch {
        // Некоторые браузеры запрещают вибрацию несмотря на наличие API.
      }
    }

    function retryPreloadIfNeeded() {
      if (!assetsReady && !isPreloading && loadErrors.length > 0) {
        preloadAssets();
        return true;
      }

      return false;
    }

    function activateCurrentState(clientX, clientY) {
      if (retryPreloadIfNeeded()) {
        return;
      }

      if (!assetsReady || isPreloading) {
        return;
      }

      if (state === STATE_START) {
        startGame();
        return;
      }

      if (state === STATE_END) {
        audioController.playSfx('button');
        returnToStart();
        return;
      }

      if (state !== STATE_GAME || victoryPending) {
        return;
      }

      const point = screenToGame(clientX, clientY);

      if (!point) {
        return;
      }

      const now = getGameNow();
      const pear = findHitPear(point, now, false);

      if (!pear) {
        const foundPear = findHitPear(point, now, true);

        if (foundPear) {
          return;
        }

        if (!usedHintThisRound) {
          penaltyMilliseconds += MISS_PENALTY_MS;
          addPenaltyText(point, now);
        }
        audioController.playSfx('miss');
        return;
      }

      pear.isFound = true;
      pear.foundAt = now;

      if (pear.id === hintedPearId) {
        hintedPearId = null;
        hintEffectUntil = 0;
      }

      spawnFindEffects(pear, now);
      vibrateOnSuccess();
      const roundComplete = pears.every(item => item.isFound);

      if (roundComplete) {
        audioController.enterEnd(true);
        scheduleVictory(now);
      } else {
        audioController.playSfx('pear');
      }
    }

    function handleGlobalPointerDown(event) {
      if (event.isPrimary === false) {
        return;
      }

      audioController.unlock();

      if (state === STATE_GAME) {
        const gameNow = getGameNow();

        if (isHintTutorialVisible(gameNow)) {
          dismissHintTutorial();
        }
      }
    }

    function handlePointerDown(event) {
      event.preventDefault();

      if (event.isPrimary === false) {
        return;
      }

      const point = screenToGame(event.clientX, event.clientY);

      if (point && pointIsInsideMuteButton(point)) {
        audioController.toggleMute();
        return;
      }

      if (point && pointIsInsideOrientationButton(point)) {
        toggleOrientation();
        return;
      }

      if (point && pointIsInsideFullscreenButton(point)) {
        void toggleFullscreen();
        return;
      }

      if (state === STATE_PAUSE) {
        if (!point) {
          pauseExitConfirmUntil = 0;
          return;
        }

        const realNow = performance.now();

        if (pointIsInsideRect(point, PAUSE_CONTINUE_RECT)) {
          resumeFromPause(realNow);
          return;
        }

        if (pointIsInsideRect(point, PAUSE_SOUND_RECT)) {
          pauseExitConfirmUntil = 0;
          audioController.toggleMute();
          volumeHudVisibleUntil = 0;
          forceHudRedraw = true;
          return;
        }

        if (pointIsInsideRect(point, PAUSE_CLEAN_HUD_RECT)) {
          toggleCleanHud();
          return;
        }

        if (pointIsInsideRect(point, PAUSE_FULLSCREEN_RECT)) {
          pauseExitConfirmUntil = 0;

          if (fullscreenSupported() && !fullscreenRequestInProgress) {
            void toggleFullscreen();
          }
          return;
        }

        if (pointIsInsideRect(point, PAUSE_EXIT_RECT)) {
          if (realNow < pauseExitConfirmUntil) {
            audioController.playSfx('button');
            returnToStart();
          } else {
            pauseExitConfirmUntil = realNow + PAUSE_EXIT_CONFIRM_MS;
            audioController.playSfx('button');
          }
          return;
        }

        pauseExitConfirmUntil = 0;
        return;
      }

      if (state === STATE_GAME && point) {
        const now = getGameNow();

        if (pointIsInsideHudRestoreTab(point)) {
          toggleCleanHud();
          return;
        }

        if (!cleanHudEnabled) {
          if (isHintTutorialVisible(now)) {
            dismissHintTutorial();
          }

          if (pointIsInsideRect(point, PAUSE_BUTTON_HIT_RECT)) {
            enterPause(performance.now());
            return;
          }

          if (pointIsInsideRect(point, HINT_BUTTON_HIT_RECT)) {
            useHint(now);
            return;
          }
        }

        const pearUnderPointer =
          findHitPear(point, now, false) ||
          findHitPear(point, now, true);

        if (pearUnderPointer) {
          activateCurrentState(event.clientX, event.clientY);
          return;
        }
      }

      const isTouchLike = event.pointerType === 'touch' || event.pointerType === 'pen';
      const isInVolumeZone = state === STATE_GAME && point &&
        point.x <= LOGICAL_WIDTH * VOLUME_SWIPE_ZONE_RATIO &&
        point.y >= VOLUME_SWIPE_MIN_LOGICAL_Y;

      if (isTouchLike && isInVolumeZone) {
        volumeGesture = {
          pointerId: event.pointerId,
          startClientX: event.clientX,
          startClientY: event.clientY,
          latestClientX: event.clientX,
          latestClientY: event.clientY,
          startVolume: audioController.globalVolume,
          moved: false
        };

        try {
          canvas.setPointerCapture(event.pointerId);
        } catch {
          // Pointer capture может отсутствовать в старых браузерах.
        }

        return;
      }

      activateCurrentState(event.clientX, event.clientY);
    }

    function handlePointerMove(event) {
      if (!volumeGesture || volumeGesture.pointerId !== event.pointerId) {
        return;
      }

      event.preventDefault();
      volumeGesture.latestClientX = event.clientX;
      volumeGesture.latestClientY = event.clientY;

      const deltaX = event.clientX - volumeGesture.startClientX;
      const deltaY = event.clientY - volumeGesture.startClientY;
      const absoluteX = Math.abs(deltaX);
      const absoluteY = Math.abs(deltaY);

      if (
        !volumeGesture.moved &&
        absoluteY >= VOLUME_SWIPE_THRESHOLD &&
        absoluteY >= absoluteX * VOLUME_SWIPE_AXIS_RATIO
      ) {
        volumeGesture.moved = true;
      }

      if (!volumeGesture.moved) {
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const travel = Math.max(
        120,
        rect.height * VOLUME_SWIPE_TRAVEL_RATIO
      );
      const delta = (
        volumeGesture.startClientY - event.clientY
      ) / travel;

      audioController.setGlobalVolume(
        volumeGesture.startVolume + delta,
        true,
        true
      );
    }

    function finishVolumeGesture(event, cancelled) {
      if (!volumeGesture || volumeGesture.pointerId !== event.pointerId) {
        return;
      }

      event.preventDefault();
      const gesture = volumeGesture;
      volumeGesture = null;

      try {
        canvas.releasePointerCapture(event.pointerId);
      } catch {
        // Захват мог быть автоматически снят браузером.
      }

      if (!cancelled && !gesture.moved) {
        activateCurrentState(
          gesture.startClientX,
          gesture.startClientY
        );
      }
    }

    function handlePointerUp(event) {
      finishVolumeGesture(event, false);
    }

    function handlePointerCancel(event) {
      finishVolumeGesture(event, true);
    }

    function handleWheel(event) {
      event.preventDefault();
      audioController.changeVolume(
        event.deltaY < 0 ? VOLUME_STEP : -VOLUME_STEP
      );
    }

    function handleKeyDown(event) {
      if (event.code === 'KeyH') {
        if (state === STATE_GAME || state === STATE_PAUSE) {
          event.preventDefault();
          toggleCleanHud();
        }
        return;
      }

      if (event.code === 'Escape') {
        if (state === STATE_GAME && !victoryPending) {
          event.preventDefault();
          enterPause(performance.now());
        } else if (state === STATE_PAUSE) {
          event.preventDefault();
          resumeFromPause(performance.now());
        }
        return;
      }

      if (event.code !== 'Enter' && event.code !== 'Space') {
        return;
      }

      audioController.unlock();

      if (state === STATE_PAUSE) {
        event.preventDefault();
        resumeFromPause(performance.now());
        return;
      }

      if (retryPreloadIfNeeded()) {
        event.preventDefault();
        return;
      }

      if (!assetsReady || isPreloading) {
        return;
      }

      if (state === STATE_START) {
        event.preventDefault();
        startGame();
      } else if (state === STATE_END) {
        event.preventDefault();
        audioController.playSfx('button');
        returnToStart();
      }
    }

    function handleVisibilityChange() {
      const realNow = performance.now();

      if (document.hidden) {
        if (pageHiddenAt <= 0) {
          pageHiddenAt = realNow;
        }

        if (state === STATE_GAME || state === STATE_PAUSE) {
          pauseGameClock('visibility', realNow);
        }

        audioController.suspendForPageHide();
        return;
      }

      if (state === STATE_GAME || state === STATE_PAUSE) {
        resumeGameClock('visibility', realNow);
      }

      if (pageHiddenAt > 0) {
        const hiddenAt = pageHiddenAt;
        const pauseDuration = Math.max(0, realNow - hiddenAt);
        pageHiddenAt = 0;

        if (state === STATE_END && pauseDuration > 0) {
          celebrationStartedAt += pauseDuration;

          for (const ring of celebrationRings) {
            ring.createdAt += pauseDuration;
          }

          for (const particle of celebrationParticles) {
            particle.createdAt += pauseDuration;
          }

          nextFireworkAt = realNow + FIREWORK_RESUME_DELAY;
        }
      }

      forceHudRedraw = true;
      audioController.resumeAfterPageShow();
    }

    function preventDefault(event) {
      event.preventDefault();
    }

    window.addEventListener('pointerdown', handleGlobalPointerDown, {
      capture: true,
      passive: true
    });

    canvas.addEventListener('pointerdown', handlePointerDown, {
      passive: false
    });
    canvas.addEventListener('pointermove', handlePointerMove, {
      passive: false
    });
    canvas.addEventListener('pointerup', handlePointerUp, {
      passive: false
    });
    canvas.addEventListener('pointercancel', handlePointerCancel, {
      passive: false
    });
    canvas.addEventListener('wheel', handleWheel, {
      passive: false
    });

    window.addEventListener('keydown', handleKeyDown);
    document.addEventListener('visibilitychange', handleVisibilityChange);

    if (
      document.fonts &&
      typeof document.fonts.addEventListener === 'function'
    ) {
      document.fonts.addEventListener('loadingdone', handleFontLoadingDone);
    }

    canvas.addEventListener('contextmenu', preventDefault);
    canvas.addEventListener('dragstart', preventDefault);

    function handleFullscreenChange() {
      fullscreenRequestInProgress = false;
      forceHudRedraw = true;
      resizeCanvas();
    }

    function handleFullscreenError() {
      fullscreenRequestInProgress = false;
      showUiNotice('Браузер не разрешил изменить полноэкранный режим');
      forceHudRedraw = true;
      resizeCanvas();
    }

    window.addEventListener('resize', resizeCanvas, { passive: true });
    window.addEventListener('orientationchange', resizeCanvas, { passive: true });
    document.addEventListener('fullscreenchange', handleFullscreenChange, {
      passive: true
    });
    document.addEventListener('webkitfullscreenchange', handleFullscreenChange, {
      passive: true
    });
    document.addEventListener('fullscreenerror', handleFullscreenError, {
      passive: true
    });
    document.addEventListener('webkitfullscreenerror', handleFullscreenError, {
      passive: true
    });

    if (
      window.screen.orientation &&
      typeof window.screen.orientation.addEventListener === 'function'
    ) {
      window.screen.orientation.addEventListener('change', resizeCanvas, {
        passive: true
      });
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resizeCanvas, {
        passive: true
      });
      window.visualViewport.addEventListener('scroll', resizeCanvas, {
        passive: true
      });
    }

    resizeCanvas();
    audioController.initialize();
    audioController.enterStart();
    prepareGameFont();
    preloadAssets();
    requestAnimationFrame(render);
  </script>
</body>
</html>
