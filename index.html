<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <meta name="theme-color" content="#000000">
  <title>Поиск предметов</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }

    canvas {
      position: fixed;
      z-index: 1;
      display: block;
      margin: 0;
      padding: 0;
      background: #000;
      touch-action: none;
      cursor: pointer;
      outline: none;
    }

    #startScreen {
      position: fixed;
      z-index: 2;
      display: none;
      margin: 0;
      padding: 0;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      image-rendering: auto;
    }

    #audioHudCanvas {
      z-index: 3;
      background: transparent;
      pointer-events: none;
      cursor: default;
    }
  </style>
</head>

<body>
  <canvas
    id="gameCanvas"
    width="1920"
    height="1080"
    role="application"
    aria-label="Игра Поиск предметов"
    tabindex="0"
  ></canvas>

  <img
    id="startScreen"
    alt=""
    aria-hidden="true"
    draggable="false"
  >

  <canvas
    id="audioHudCanvas"
    width="1920"
    height="1080"
    aria-hidden="true"
  ></canvas>

  <script>
    'use strict';

    const LOGICAL_WIDTH = 1920;
    const LOGICAL_HEIGHT = 1080;
    const MAX_BACKING_SCALE = 2;

    const PEAR_COUNT = 10;
    const PEAR_MAX_SIDE = 98;
    const EDGE_MARGIN = 100;
    const MIN_CENTER_DISTANCE = 200;
    const POSITION_ATTEMPTS = 1000;
    const LAYOUT_ATTEMPTS = 25;

    const EFFECT_DURATION = 500;
    const POP_DURATION = 320;
    const VICTORY_DELAY = 580;
    const FIREWORK_SPAWN_INTERVAL = 1050;
    const FIREWORK_PARTICLE_DURATION = 1050;
    const FIREWORK_INITIAL_BURSTS = 3;
    const FIREWORK_SEQUENCE_DURATION = 6200;
    const FIREWORK_PARTICLES_PER_BURST = 18;
    const FIREWORK_MAX_PARTICLES = 72;
    const FIREWORK_MAX_RINGS = 5;
    const IMAGE_LOAD_TIMEOUT = 15000;

    const DEFAULT_GLOBAL_VOLUME = 0.7;
    const VOLUME_STEP = 0.05;
    const VOLUME_HUD_DURATION = 1500;
    const VOLUME_HUD_FADE_DURATION = 450;
    const VOLUME_SWIPE_ZONE_RATIO = 0.15;
    const VOLUME_SWIPE_TRAVEL_RATIO = 0.6;
    const VOLUME_SWIPE_THRESHOLD = 24;
    const VOLUME_SWIPE_AXIS_RATIO = 1.2;
    const MUSIC_FADE_OUT_DURATION = 800;
    const AUDIO_LOAD_TIMEOUT = 12000;

    const BEST_TIME_STORAGE_KEY = 'pear_game_best_time';
    const MISS_PENALTY_MS = 3000;
    const PENALTY_TEXT_DURATION = 1000;
    const PENALTY_TEXT_MAX_COUNT = 8;
    const HINT_COOLDOWN_MS = 15000;
    const HINT_EFFECT_DURATION = 1500;
    const FIREWORK_MAX_SPAWNS_PER_FRAME = 1;
    const FIREWORK_RESUME_DELAY = 260;

    // Перезапуск выполняется через настоящий двухкадровый blackout:
    // сначала браузер успевает показать непрозрачную шторку, затем под ней
    // создаётся новая раскладка. Финальное открытие происходит мгновенным срезом,
    // чтобы игрок не видел, как все груши одновременно проявляются из затемнения.
    const RESTART_MIN_COVER_DURATION = 560;
    const RESTART_POST_LAYOUT_HOLD = 120;
    const RESTART_FAILURE_HOLD = 900;

    const SFX_MIN_INTERVALS = Object.freeze({
      button: 90,
      pear: 70,
      miss: 130,
      complete: 500
    });

    const MUTE_BUTTON_RECT = Object.freeze({
      x: 24,
      y: 22,
      width: 136,
      height: 104
    });

    const MUTE_BUTTON_HIT_RECT = Object.freeze({
      x: 0,
      y: 0,
      width: 167,
      height: 180
    });

    const GAME_CONTROL_SPAWN_BLOCK_RECT = Object.freeze({
      x: 0,
      y: 0,
      width: 190,
      height: 180
    });

    const HINT_BUTTON_RECT = Object.freeze({
      x: 24,
      y: 22,
      width: 136,
      height: 104
    });

    const HINT_BUTTON_HIT_RECT = Object.freeze({
      x: 0,
      y: 0,
      width: 167,
      height: 180
    });

    const STATE_START = 'STATE_START';
    const STATE_GAME = 'STATE_GAME';
    const STATE_RESTARTING = 'STATE_RESTARTING';
    const STATE_END = 'STATE_END';

    const HUD_RECT = Object.freeze({
      x: LOGICAL_WIDTH - 560,
      y: 18,
      width: 526,
      height: 82
    });

    const canvas = document.getElementById('gameCanvas');
    const startScreen = document.getElementById('startScreen');
    const audioHudCanvas = document.getElementById('audioHudCanvas');

    const ctx = canvas.getContext('2d', {
      alpha: false,
      desynchronized: true
    });

    const hudCtx = audioHudCanvas.getContext('2d', {
      alpha: true,
      desynchronized: true
    });

    if (!ctx || !hudCtx) {
      throw new Error('Canvas 2D не поддерживается этим браузером.');
    }

    if (!(startScreen instanceof HTMLImageElement)) {
      throw new Error('Не найден HTML-элемент стартового экрана.');
    }

    const START_GIF_PATH = encodeURI('СТАРТ.gif');
    const START_PNG_PATH = encodeURI('СТАРТ.png');

    const assetFiles = Object.freeze({
      level: encodeURI('игровой-уровень.png'),
      end: encodeURI('конец-игры.png'),
      pear: encodeURI('груша.png'),
      pearColor: encodeURI('груша-цвет.png')
    });

    const audioFiles = Object.freeze({
      introMusic: encodeURI('intromusic.mp3'),
      levelMusic: encodeURI('levelmusic.mp3'),
      soundButton: encodeURI('soundButton.mp3'),
      soundPearClick: encodeURI('soundPearClick.mp3'),
      soundMiss: encodeURI('soundMiss.mp3'),
      soundLevelComplete: encodeURI('soundLevelComplete.mp3')
    });

    const LOGICAL_ASSET_COUNT = 1 + Object.keys(assetFiles).length;
    const images = Object.create(null);

    let state = STATE_START;
    let pears = [];
    let particles = [];
    let bursts = [];
    let celebrationParticles = [];
    let celebrationRings = [];
    let celebrationStartedAt = 0;
    let nextFireworkAt = 0;
    let blurredEndBackgroundCanvas = null;

    let assetsReady = false;
    let isPreloading = false;
    let loadedAssets = 0;
    let loadErrors = [];
    let startAssetSource = '';
    let startAssetIsGif = false;
    let startScreenVisible = false;

    let timerStartedAt = 0;
    let finalElapsed = 0;
    let penaltyMilliseconds = 0;
    let penaltyTexts = [];
    let bestTime = loadBestTime();
    let isNewRecord = false;
    let victoryPending = false;
    let victoryTransitionAt = 0;
    let hintCooldownUntil = 0;
    let hintedPearId = null;
    let hintEffectUntil = 0;
    let usedHintThisRound = false;

    let volumeHudVisibleUntil = 0;
    let volumeGesture = null;
    let pageHiddenAt = 0;

    let restartTransitionStartedAt = 0;
    let restartPausedRoundAt = 0;
    let restartCoverPresented = false;
    let restartLayoutPreparing = false;
    let restartLayoutPrepared = false;
    let restartRevealAt = 0;
    let restartFailureMessage = '';
    let restartFailureReturnAt = 0;

    function clamp(value, minimum, maximum) {
      return Math.min(maximum, Math.max(minimum, value));
    }

    function loadBestTime() {
      try {
        const stored = Number.parseInt(
          window.localStorage.getItem(BEST_TIME_STORAGE_KEY),
          10
        );

        if (Number.isFinite(stored) && stored >= 0) {
          return stored;
        }
      } catch {
        // Игра продолжает работать без localStorage.
      }

      return null;
    }

    function saveBestTime(value) {
      try {
        window.localStorage.setItem(
          BEST_TIME_STORAGE_KEY,
          String(Math.max(0, Math.floor(value)))
        );
      } catch {
        // Рекорд остаётся доступен в текущей вкладке.
      }
    }

    class AudioController {
      constructor(files) {
        this.files = files;
        this.music = {
          intro: null,
          level: null
        };
        this.sfx = {
          button: null,
          pear: null,
          miss: null,
          complete: null
        };
        this.musicFadeFactors = {
          intro: 1,
          level: 1
        };
        this.activeSfx = new Set();
        this.lastSfxPlayedAt = Object.create(null);
        this.audioContext = null;
        this.unlocked = false;
        this.pageSuspended = false;
        this.desiredMusic = 'intro';
        this.transitionToken = 0;
        this.musicTransitionInProgress = false;
        this.globalVolume = this.loadStoredVolume();
        this.lastAudibleVolume = this.globalVolume > 0
          ? this.globalVolume
          : DEFAULT_GLOBAL_VOLUME;
        this.muted = this.loadStoredMute();
      }

      loadStoredVolume() {
        try {
          const stored = Number.parseFloat(
            window.localStorage.getItem('pearGameGlobalVolume')
          );

          if (Number.isFinite(stored)) {
            return clamp(stored, 0, 1);
          }
        } catch {
          // localStorage может быть отключён в приватном режиме.
        }

        return DEFAULT_GLOBAL_VOLUME;
      }

      loadStoredMute() {
        try {
          return window.localStorage.getItem('pearGameMuted') === '1';
        } catch {
          return false;
        }
      }

      saveSettings() {
        try {
          window.localStorage.setItem(
            'pearGameGlobalVolume',
            String(this.globalVolume)
          );
          window.localStorage.setItem(
            'pearGameMuted',
            this.muted ? '1' : '0'
          );
        } catch {
          // Игра продолжает работать без сохранения настроек.
        }
      }

      get effectiveVolume() {
        return this.muted ? 0 : this.globalVolume;
      }

      get isEffectivelyMuted() {
        return this.muted || this.globalVolume <= 0;
      }

      initialize() {
        const tasks = [
          this.loadOptionalAudio(this.files.introMusic, true)
            .then(audio => this.registerMusicTrack('intro', audio))
            .catch(() => null),

          this.loadOptionalAudio(this.files.levelMusic, true)
            .then(audio => this.registerMusicTrack('level', audio))
            .catch(() => null),

          this.loadOptionalAudio(this.files.soundButton, false)
            .then(audio => {
              this.sfx.button = audio;
            })
            .catch(() => null),

          this.loadOptionalAudio(this.files.soundPearClick, false)
            .then(audio => {
              this.sfx.pear = audio;
            })
            .catch(() => null),

          this.loadOptionalAudio(this.files.soundMiss, false)
            .then(audio => {
              this.sfx.miss = audio;
            })
            .catch(() => null),

          this.loadOptionalAudio(this.files.soundLevelComplete, false)
            .then(audio => {
              this.sfx.complete = audio;
            })
            .catch(() => null)
        ];

        Promise.allSettled(tasks).catch(() => {
          // Ошибки аудио никогда не блокируют игру.
        });
      }

      registerMusicTrack(name, audio) {
        this.music[name] = audio;
        this.applyMusicVolume(name);

        if (
          this.unlocked &&
          !this.pageSuspended &&
          !this.musicTransitionInProgress &&
          this.desiredMusic === name
        ) {
          this.playTrack(name);
        }

        return audio;
      }

      loadOptionalAudio(path, loop) {
        try {
          return new Promise((resolve, reject) => {
            const audio = new Audio();
            let settled = false;

            const finish = (handler, value) => {
              if (settled) {
                return;
              }

              settled = true;
              window.clearTimeout(timeoutId);
              audio.removeEventListener('canplay', onReady);
              audio.removeEventListener('loadeddata', onReady);
              audio.removeEventListener('error', onError);
              handler(value);
            };

            const onReady = () => finish(resolve, audio);
            const onError = () => finish(
              reject,
              new Error(`Не удалось загрузить аудио «${decodeURI(path)}».`)
            );

            const timeoutId = window.setTimeout(() => {
              finish(
                reject,
                new Error(`Истекло время загрузки аудио «${decodeURI(path)}».`)
              );
            }, AUDIO_LOAD_TIMEOUT);

            audio.preload = 'auto';
            audio.loop = loop;
            audio.playsInline = true;
            audio.addEventListener('canplay', onReady, { once: true });
            audio.addEventListener('loadeddata', onReady, { once: true });
            audio.addEventListener('error', onError, { once: true });
            audio.src = path;
            audio.load();
          });
        } catch (error) {
          return Promise.reject(error);
        }
      }

      getAudioContext() {
        if (this.audioContext) {
          return this.audioContext;
        }

        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) {
          return null;
        }

        try {
          this.audioContext = new AudioContextClass();
        } catch {
          this.audioContext = null;
        }

        return this.audioContext;
      }

      resumeAudioContext() {
        const audioContext = this.getAudioContext();

        if (!audioContext || audioContext.state !== 'suspended') {
          return;
        }

        audioContext.resume().catch(() => {
          // Синтезированный fallback останется беззвучным.
        });
      }

      unlock() {
        const isFirstUnlock = !this.unlocked;
        this.unlocked = true;
        this.resumeAudioContext();

        if (this.pageSuspended) {
          return;
        }

        if (isFirstUnlock) {
          this.syncDesiredMusic();
          return;
        }

        if (!this.musicTransitionInProgress && this.desiredMusic) {
          const desiredTrack = this.music[this.desiredMusic];

          if (desiredTrack && desiredTrack.paused) {
            this.playTrack(this.desiredMusic);
          }
        }
      }

      setGlobalVolume(value, showHud = true) {
        const wasEffectivelyMuted = this.isEffectivelyMuted;
        const nextVolume = Math.round(clamp(value, 0, 1) * 100) / 100;

        if (nextVolume > 0) {
          this.lastAudibleVolume = nextVolume;
        }

        if (Math.abs(nextVolume - this.globalVolume) < 0.001) {
          if (showHud) {
            showVolumeHud();
          }
          return;
        }

        this.globalVolume = nextVolume;
        this.applyAllVolumes();
        this.saveSettings();

        if (
          wasEffectivelyMuted &&
          !this.isEffectivelyMuted &&
          !this.pageSuspended
        ) {
          this.resumeAudioContext();
          this.syncDesiredMusic();
        }

        if (showHud) {
          showVolumeHud();
        }
      }

      changeVolume(delta) {
        this.setGlobalVolume(this.globalVolume + delta, true);
      }

      toggleMute() {
        if (this.muted) {
          this.muted = false;

          if (this.globalVolume <= 0) {
            this.globalVolume = clamp(
              this.lastAudibleVolume || DEFAULT_GLOBAL_VOLUME,
              VOLUME_STEP,
              1
            );
          }
        } else if (this.globalVolume <= 0) {
          this.globalVolume = clamp(
            this.lastAudibleVolume || DEFAULT_GLOBAL_VOLUME,
            VOLUME_STEP,
            1
          );
          this.muted = false;
        } else {
          this.muted = true;
        }

        this.applyAllVolumes();
        this.saveSettings();
        showVolumeHud();

        if (!this.muted && !this.pageSuspended) {
          this.resumeAudioContext();
          this.syncDesiredMusic();
        }
      }

      applyAllVolumes() {
        this.applyMusicVolume('intro');
        this.applyMusicVolume('level');

        for (const instance of this.activeSfx) {
          instance.volume = clamp(this.effectiveVolume * 0.85, 0, 1);
        }
      }

      applyMusicVolume(name) {
        const audio = this.music[name];

        if (!audio) {
          return;
        }

        const fadeFactor = this.musicFadeFactors[name] ?? 1;
        audio.volume = clamp(
          this.effectiveVolume * 0.65 * fadeFactor,
          0,
          1
        );
      }

      pauseTrack(name) {
        const audio = this.music[name];

        if (!audio) {
          return;
        }

        try {
          audio.pause();
        } catch {
          // Невозможность приостановки аудио не влияет на игру.
        }
      }

      stopTrack(name) {
        const audio = this.music[name];

        if (!audio) {
          this.musicFadeFactors[name] = 1;
          return;
        }

        try {
          audio.pause();
          audio.currentTime = 0;
        } catch {
          // Невозможность остановки аудио не влияет на игру.
        }

        this.musicFadeFactors[name] = 1;
        this.applyMusicVolume(name);
      }

      playTrack(name) {
        const audio = this.music[name];

        if (
          !audio ||
          !this.unlocked ||
          this.pageSuspended ||
          this.isEffectivelyMuted
        ) {
          return;
        }

        this.musicFadeFactors[name] = 1;
        this.applyMusicVolume(name);

        try {
          const playPromise = audio.play();

          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {
              // Autoplay может быть заблокирован до пользовательского жеста.
            });
          }
        } catch {
          // Музыка опциональна: игра продолжает работать без неё.
        }
      }

      syncDesiredMusic() {
        if (!this.unlocked || this.pageSuspended) {
          return;
        }

        if (this.musicTransitionInProgress) {
          return;
        }

        if (this.desiredMusic === 'intro') {
          this.stopTrack('level');
          this.playTrack('intro');
        } else if (this.desiredMusic === 'level') {
          this.stopTrack('intro');
          this.playTrack('level');
        } else {
          this.stopTrack('intro');
          this.stopTrack('level');
        }
      }

      enterStart() {
        this.transitionToken += 1;
        this.musicTransitionInProgress = false;
        this.desiredMusic = 'intro';
        this.stopTrack('level');
        this.playTrack('intro');
      }

      transitionToGame() {
        const token = ++this.transitionToken;
        this.desiredMusic = 'level';
        this.musicTransitionInProgress = true;
        this.stopTrack('level');

        const intro = this.music.intro;

        if (
          !this.unlocked ||
          this.pageSuspended ||
          !intro ||
          intro.paused
        ) {
          this.stopTrack('intro');
          this.musicTransitionInProgress = false;
          this.playTrack('level');
          return;
        }

        this.fadeOutTrack('intro', MUSIC_FADE_OUT_DURATION, token)
          .then(completed => {
            if (
              completed &&
              token === this.transitionToken &&
              this.desiredMusic === 'level'
            ) {
              this.musicTransitionInProgress = false;
              this.playTrack('level');
            }
          })
          .catch(() => {
            if (
              token === this.transitionToken &&
              this.desiredMusic === 'level'
            ) {
              this.stopTrack('intro');
              this.musicTransitionInProgress = false;
              this.playTrack('level');
            }
          });
      }

      fadeOutTrack(name, durationMilliseconds, token) {
        return new Promise(resolve => {
          const audio = this.music[name];

          if (!audio || audio.paused || durationMilliseconds <= 0) {
            this.stopTrack(name);
            resolve(true);
            return;
          }

          const startedAt = performance.now();

          const step = now => {
            if (token !== this.transitionToken) {
              resolve(false);
              return;
            }

            const progress = clamp(
              (now - startedAt) / durationMilliseconds,
              0,
              1
            );

            this.musicFadeFactors[name] = 1 - progress;
            this.applyMusicVolume(name);

            if (progress >= 1) {
              this.stopTrack(name);
              resolve(true);
              return;
            }

            requestAnimationFrame(step);
          };

          requestAnimationFrame(step);
        });
      }

      enterEnd(playCompletionSound = true) {
        this.transitionToken += 1;
        this.musicTransitionInProgress = false;
        this.desiredMusic = null;
        this.stopTrack('intro');
        this.stopTrack('level');

        if (playCompletionSound) {
          this.playSfx('complete');
        }
      }

      suspendForPageHide() {
        if (this.pageSuspended) {
          return;
        }

        this.pageSuspended = true;
        this.transitionToken += 1;
        this.musicTransitionInProgress = false;
        this.pauseTrack('intro');
        this.pauseTrack('level');

        for (const instance of this.activeSfx) {
          try {
            instance.pause();
          } catch {
            // Короткий эффект может уже завершиться.
          }
        }

        this.activeSfx.clear();

        const audioContext = this.audioContext;

        if (audioContext && audioContext.state === 'running') {
          audioContext.suspend().catch(() => null);
        }
      }

      resumeAfterPageShow() {
        if (!this.pageSuspended) {
          return;
        }

        this.pageSuspended = false;
        this.resumeAudioContext();
        this.syncDesiredMusic();
      }

      playSfx(name) {
        if (this.isEffectivelyMuted || this.pageSuspended) {
          return;
        }

        const now = performance.now();
        const minimumInterval = SFX_MIN_INTERVALS[name] ?? 0;
        const lastPlayedAt = this.lastSfxPlayedAt[name] ?? -Infinity;

        if (now - lastPlayedAt < minimumInterval) {
          return;
        }

        this.lastSfxPlayedAt[name] = now;
        const source = this.sfx[name];

        if (!source) {
          this.synthesizeSfx(name);
          return;
        }

        try {
          const instance = source.cloneNode(true);
          instance.loop = false;
          instance.volume = clamp(this.effectiveVolume * 0.85, 0, 1);
          this.activeSfx.add(instance);

          let released = false;
          const releaseTimer = window.setTimeout(() => {
            release();
          }, 10000);

          const release = () => {
            if (released) {
              return;
            }

            released = true;
            window.clearTimeout(releaseTimer);
            this.activeSfx.delete(instance);
          };

          instance.addEventListener('ended', release, { once: true });
          instance.addEventListener('error', release, { once: true });

          const playPromise = instance.play();

          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {
              release();
              this.synthesizeSfx(name);
            });
          }
        } catch {
          this.synthesizeSfx(name);
        }
      }

      synthesizeSfx(name) {
        if (this.isEffectivelyMuted || this.pageSuspended) {
          return;
        }

        const audioContext = this.getAudioContext();

        if (!audioContext) {
          return;
        }

        const play = () => {
          try {
            const now = audioContext.currentTime;

            if (name === 'complete') {
              const melody = [
                { frequency: 523.25, delay: 0, duration: 0.15, gain: 0.105 },
                { frequency: 659.25, delay: 0.12, duration: 0.15, gain: 0.105 },
                { frequency: 783.99, delay: 0.24, duration: 0.18, gain: 0.11 },
                { frequency: 1046.5, delay: 0.39, duration: 0.28, gain: 0.115 }
              ];

              for (const note of melody) {
                this.playSynthTone(
                  note.frequency * 0.985,
                  note.frequency,
                  now + note.delay,
                  note.duration,
                  'triangle',
                  note.gain
                );
              }

              const chordStart = now + 0.62;
              this.playSynthTone(1046.5, 1058, chordStart, 0.48, 'sine', 0.085);
              this.playSynthTone(1318.51, 1330, chordStart, 0.48, 'sine', 0.065);
              this.playSynthTone(1567.98, 1580, chordStart, 0.48, 'triangle', 0.055);
            } else if (name === 'pear') {
              this.playSynthTone(784, 1174.66, now, 0.17, 'sine', 0.09);
              this.playSynthTone(1567.98, 1318.51, now + 0.028, 0.24, 'triangle', 0.045);
              this.playSynthTone(2349.32, 2093, now + 0.045, 0.16, 'sine', 0.025);
            } else if (name === 'miss') {
              this.playSynthTone(235, 170, now, 0.17, 'sine', 0.075);
              this.playSynthTone(117.5, 102, now + 0.015, 0.14, 'triangle', 0.035);
            } else {
              this.playSynthTone(360, 480, now, 0.09, 'sine', 0.08);
            }
          } catch {
            // Синтезированный звук также остаётся необязательным.
          }
        };

        if (audioContext.state === 'suspended') {
          audioContext.resume().then(play).catch(() => null);
        } else {
          play();
        }
      }

      playSynthTone(
        startFrequency,
        endFrequency,
        startTime,
        duration,
        oscillatorType,
        gainAmount
      ) {
        const audioContext = this.audioContext;

        if (!audioContext) {
          return;
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const finalGain = clamp(
          gainAmount * this.effectiveVolume,
          0.0001,
          0.25
        );

        oscillator.type = oscillatorType;
        oscillator.frequency.setValueAtTime(startFrequency, startTime);
        oscillator.frequency.exponentialRampToValueAtTime(
          Math.max(1, endFrequency),
          startTime + duration
        );

        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(
          finalGain,
          startTime + 0.012
        );
        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          startTime + duration
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(startTime);
        oscillator.stop(startTime + duration + 0.02);
      }
    }

    const audioController = new AudioController(audioFiles);

    function configureContexts() {
      const scaleX = canvas.width / LOGICAL_WIDTH;
      const scaleY = canvas.height / LOGICAL_HEIGHT;

      ctx.setTransform(scaleX, 0, 0, scaleY, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      hudCtx.setTransform(scaleX, 0, 0, scaleY, 0, 0);
      hudCtx.imageSmoothingEnabled = true;
      hudCtx.imageSmoothingQuality = 'high';
    }

    function getViewportMetrics() {
      const viewport = window.visualViewport;

      if (viewport) {
        return {
          width: Math.max(1, viewport.width),
          height: Math.max(1, viewport.height),
          left: viewport.offsetLeft,
          top: viewport.offsetTop
        };
      }

      return {
        width: Math.max(1, window.innerWidth),
        height: Math.max(1, window.innerHeight),
        left: 0,
        top: 0
      };
    }

    function resizeCanvas() {
      const viewport = getViewportMetrics();
      const cssScale = Math.min(
        viewport.width / LOGICAL_WIDTH,
        viewport.height / LOGICAL_HEIGHT
      );

      const displayWidth = LOGICAL_WIDTH * cssScale;
      const displayHeight = LOGICAL_HEIGHT * cssScale;

      const displayLeft = viewport.left + (viewport.width - displayWidth) / 2;
      const displayTop = viewport.top + (viewport.height - displayHeight) / 2;

      canvas.style.width = `${displayWidth}px`;
      canvas.style.height = `${displayHeight}px`;
      canvas.style.left = `${displayLeft}px`;
      canvas.style.top = `${displayTop}px`;

      audioHudCanvas.style.width = `${displayWidth}px`;
      audioHudCanvas.style.height = `${displayHeight}px`;
      audioHudCanvas.style.left = `${displayLeft}px`;
      audioHudCanvas.style.top = `${displayTop}px`;

      startScreen.style.width = `${displayWidth}px`;
      startScreen.style.height = `${displayHeight}px`;
      startScreen.style.left = `${displayLeft}px`;
      startScreen.style.top = `${displayTop}px`;

      const devicePixelRatio = Math.max(window.devicePixelRatio || 1, 1);
      const backingScale = Math.min(
        MAX_BACKING_SCALE,
        Math.max(0.05, cssScale * devicePixelRatio)
      );

      const targetWidth = Math.max(1, Math.round(LOGICAL_WIDTH * backingScale));
      const targetHeight = Math.max(1, Math.round(LOGICAL_HEIGHT * backingScale));

      if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
        canvas.width = targetWidth;
        canvas.height = targetHeight;
      }

      if (
        audioHudCanvas.width !== targetWidth ||
        audioHudCanvas.height !== targetHeight
      ) {
        audioHudCanvas.width = targetWidth;
        audioHudCanvas.height = targetHeight;
      }

      configureContexts();
    }

    function screenToGame(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();

      if (rect.width <= 0 || rect.height <= 0) {
        return null;
      }

      const normalizedX = (clientX - rect.left) / rect.width;
      const normalizedY = (clientY - rect.top) / rect.height;

      if (
        normalizedX < 0 ||
        normalizedX > 1 ||
        normalizedY < 0 ||
        normalizedY > 1
      ) {
        return null;
      }

      return {
        x: normalizedX * LOGICAL_WIDTH,
        y: normalizedY * LOGICAL_HEIGHT
      };
    }

    function loadImage(path, timeoutMilliseconds = IMAGE_LOAD_TIMEOUT) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        let settled = false;

        const timeoutId = window.setTimeout(() => {
          finish(
            reject,
            new Error(
              `Истекло время ожидания файла «${decodeURI(path)}».`
            )
          );
        }, timeoutMilliseconds);

        function cleanup() {
          window.clearTimeout(timeoutId);
          image.onload = null;
          image.onerror = null;
        }

        function finish(callback, value) {
          if (settled) {
            return;
          }

          settled = true;
          cleanup();
          callback(value);
        }

        image.decoding = 'async';
        image.draggable = false;

        image.onload = () => {
          finish(resolve, image);
        };

        image.onerror = () => {
          finish(
            reject,
            new Error(`Не удалось загрузить файл «${decodeURI(path)}».`)
          );
        };

        image.src = path;
      });
    }

    function loadDomImage(
      image,
      path,
      timeoutMilliseconds = IMAGE_LOAD_TIMEOUT
    ) {
      return new Promise((resolve, reject) => {
        let settled = false;

        const timeoutId = window.setTimeout(() => {
          finish(
            reject,
            new Error(
              `Истекло время ожидания файла «${decodeURI(path)}».`
            )
          );
        }, timeoutMilliseconds);

        function cleanup() {
          window.clearTimeout(timeoutId);
          image.removeEventListener('load', handleLoad);
          image.removeEventListener('error', handleError);
        }

        function finish(callback, value) {
          if (settled) {
            return;
          }

          settled = true;
          cleanup();
          callback(value);
        }

        function handleLoad() {
          if (image.naturalWidth <= 0 || image.naturalHeight <= 0) {
            handleError();
            return;
          }

          finish(resolve, image);
        }

        function handleError() {
          finish(
            reject,
            new Error(`Не удалось загрузить файл «${decodeURI(path)}».`)
          );
        }

        image.addEventListener('load', handleLoad);
        image.addEventListener('error', handleError);
        image.src = path;
      });
    }

    async function loadStartImageWithFallback() {
      startScreen.removeAttribute('src');

      try {
        const gifImage = await loadDomImage(startScreen, START_GIF_PATH);
        startAssetSource = decodeURI(START_GIF_PATH);
        startAssetIsGif = true;
        return gifImage;
      } catch (gifError) {
        console.warn(
          'Файл «СТАРТ.gif» не загружен. Используется резервный «СТАРТ.png».',
          gifError
        );
      }

      try {
        const pngImage = await loadDomImage(startScreen, START_PNG_PATH);
        startAssetSource = decodeURI(START_PNG_PATH);
        startAssetIsGif = false;
        return pngImage;
      } catch (pngError) {
        startScreen.removeAttribute('src');
        throw new Error(
          'Не удалось загрузить стартовый экран: отсутствуют или повреждены ' +
          '«СТАРТ.gif» и «СТАРТ.png».'
        );
      }
    }


    async function preloadAssets() {
      if (isPreloading) {
        return;
      }

      isPreloading = true;
      assetsReady = false;
      loadedAssets = 0;
      loadErrors = [];
      startAssetSource = '';
      startAssetIsGif = false;
      blurredEndBackgroundCanvas = null;
      setStartScreenVisible(false);
      startScreen.removeAttribute('src');

      for (const key of Object.keys(images)) {
        delete images[key];
      }

      const tasks = [
        {
          key: 'start',
          load: loadStartImageWithFallback
        },
        ...Object.entries(assetFiles).map(([key, path]) => ({
          key,
          load: () => loadImage(path)
        }))
      ];

      try {
        const results = await Promise.all(
          tasks.map(async task => {
            try {
              const image = await task.load();
              return { key: task.key, image, error: null };
            } catch (error) {
              return {
                key: task.key,
                image: null,
                error: error instanceof Error ? error.message : String(error)
              };
            } finally {
              loadedAssets += 1;
            }
          })
        );

        loadErrors = results
          .filter(result => result.error)
          .map(result => result.error);

        if (loadErrors.length > 0) {
          return;
        }

        for (const result of results) {
          images[result.key] = result.image;
        }

        validateAssets();
        createBlurredEndBackgroundCache();
        resetRunData();
        assetsReady = true;
        state = STATE_START;
        syncStartScreenVisibility();
      } finally {
        isPreloading = false;
      }
    }

    function validateAssets() {
      const backgroundEntries = [
        ['start', startAssetSource || 'стартовый экран'],
        ['level', 'игровой-уровень.png'],
        ['end', 'конец-игры.png']
      ];

      console.info(
        `Стартовый экран: ${startAssetSource}` +
        (startAssetIsGif ? ' (анимированный GIF)' : ' (статический PNG)')
      );

      for (const [key, label] of backgroundEntries) {
        const image = images[key];

        if (
          image.naturalWidth !== LOGICAL_WIDTH ||
          image.naturalHeight !== LOGICAL_HEIGHT
        ) {
          console.warn(
            `${label}: ожидалось ${LOGICAL_WIDTH}x${LOGICAL_HEIGHT}, ` +
            `получено ${image.naturalWidth}x${image.naturalHeight}.`
          );
        }
      }

      if (
        images.pear.naturalWidth !== images.pearColor.naturalWidth ||
        images.pear.naturalHeight !== images.pearColor.naturalHeight
      ) {
        console.warn(
          'Размеры «груша.png» и «груша-цвет.png» различаются. ' +
          'Цветной вариант будет приведён к размеру обычного.'
        );
      }
    }

    function randomRange(min, max) {
      return min + Math.random() * (max - min);
    }

    function randomBoolean() {
      return Math.random() < 0.5;
    }

    function degreesToRadians(degrees) {
      return degrees * Math.PI / 180;
    }

    function shuffle(array) {
      for (let index = array.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [array[index], array[randomIndex]] = [array[randomIndex], array[index]];
      }

      return array;
    }

    function getPearSize() {
      const sourceWidth = images.pear.naturalWidth;
      const sourceHeight = images.pear.naturalHeight;

      if (sourceWidth >= sourceHeight) {
        return {
          width: PEAR_MAX_SIDE,
          height: PEAR_MAX_SIDE * sourceHeight / sourceWidth
        };
      }

      return {
        width: PEAR_MAX_SIDE * sourceWidth / sourceHeight,
        height: PEAR_MAX_SIDE
      };
    }

    function getRotatedHalfExtents(width, height, angle) {
      const cosine = Math.abs(Math.cos(angle));
      const sine = Math.abs(Math.sin(angle));

      return {
        halfWidth: cosine * width / 2 + sine * height / 2,
        halfHeight: sine * width / 2 + cosine * height / 2
      };
    }

    function rectanglesOverlap(first, second) {
      return (
        first.x < second.x + second.width &&
        first.x + first.width > second.x &&
        first.y < second.y + second.height &&
        first.y + first.height > second.y
      );
    }

    function createPear(id, x, y, width, height, angle, flipX, flipY) {
      return {
        id,
        x,
        y,
        width,
        height,
        angle,
        flipX,
        flipY,
        isFound: false,
        foundAt: 0
      };
    }

    function isCandidateValid(candidate, placedPears) {
      const extents = getRotatedHalfExtents(
        candidate.width,
        candidate.height,
        candidate.angle
      );

      const candidateRect = {
        x: candidate.x - extents.halfWidth,
        y: candidate.y - extents.halfHeight,
        width: extents.halfWidth * 2,
        height: extents.halfHeight * 2
      };

      if (
        rectanglesOverlap(candidateRect, HUD_RECT) ||
        rectanglesOverlap(candidateRect, GAME_CONTROL_SPAWN_BLOCK_RECT)
      ) {
        return false;
      }

      for (const other of placedPears) {
        const distance = Math.hypot(
          candidate.x - other.x,
          candidate.y - other.y
        );

        if (distance < MIN_CENTER_DISTANCE) {
          return false;
        }
      }

      return true;
    }

    function buildRandomCandidate(id, width, height) {
      const angle = degreesToRadians(randomRange(-35, 35));
      const flipX = randomBoolean();
      const flipY = randomBoolean();
      const extents = getRotatedHalfExtents(width, height, angle);
      const minX = EDGE_MARGIN + extents.halfWidth;
      const maxX = LOGICAL_WIDTH - EDGE_MARGIN - extents.halfWidth;
      const minY = EDGE_MARGIN + extents.halfHeight;
      const maxY = LOGICAL_HEIGHT - EDGE_MARGIN - extents.halfHeight;

      return createPear(
        id,
        randomRange(minX, maxX),
        randomRange(minY, maxY),
        width,
        height,
        angle,
        flipX,
        flipY
      );
    }

    function tryCreateRandomLayout(width, height) {
      const result = [];

      for (let id = 0; id < PEAR_COUNT; id += 1) {
        let placed = null;

        for (let attempt = 0; attempt < POSITION_ATTEMPTS; attempt += 1) {
          const candidate = buildRandomCandidate(id, width, height);

          if (isCandidateValid(candidate, result)) {
            placed = candidate;
            break;
          }
        }

        if (!placed) {
          return null;
        }

        result.push(placed);
      }

      return result;
    }

    function createGuaranteedFallbackLayout(width, height) {
      const basePoints = shuffle([
        { x: 220, y: 300 },
        { x: 590, y: 300 },
        { x: 960, y: 300 },
        { x: 1330, y: 300 },
        { x: 1700, y: 300 },
        { x: 220, y: 780 },
        { x: 590, y: 780 },
        { x: 960, y: 780 },
        { x: 1330, y: 780 },
        { x: 1700, y: 780 }
      ]);

      const result = [];

      for (let id = 0; id < basePoints.length; id += 1) {
        const point = basePoints[id];
        let selected = null;

        for (let attempt = 0; attempt < 100; attempt += 1) {
          const angle = degreesToRadians(randomRange(-35, 35));
          const extents = getRotatedHalfExtents(width, height, angle);
          const minX = EDGE_MARGIN + extents.halfWidth;
          const maxX = LOGICAL_WIDTH - EDGE_MARGIN - extents.halfWidth;
          const minY = EDGE_MARGIN + extents.halfHeight;
          const maxY = LOGICAL_HEIGHT - EDGE_MARGIN - extents.halfHeight;

          const candidate = createPear(
            id,
            Math.max(minX, Math.min(maxX, point.x + randomRange(-35, 35))),
            Math.max(minY, Math.min(maxY, point.y + randomRange(-35, 35))),
            width,
            height,
            angle,
            randomBoolean(),
            randomBoolean()
          );

          if (isCandidateValid(candidate, result)) {
            selected = candidate;
            break;
          }
        }

        if (!selected) {
          const candidate = createPear(
            id,
            point.x,
            point.y,
            width,
            height,
            0,
            randomBoolean(),
            randomBoolean()
          );

          if (!isCandidateValid(candidate, result)) {
            return null;
          }

          selected = candidate;
        }

        result.push(selected);
      }

      return result;
    }

    function createPearLayout() {
      const size = getPearSize();

      for (let layoutAttempt = 0; layoutAttempt < LAYOUT_ATTEMPTS; layoutAttempt += 1) {
        const layout = tryCreateRandomLayout(size.width, size.height);

        if (layout) {
          return layout;
        }
      }

      console.warn(
        'Случайная расстановка не удалась. Использована гарантированная сетка.'
      );

      const fallbackLayout = createGuaranteedFallbackLayout(
        size.width,
        size.height
      );

      if (!fallbackLayout) {
        throw new Error('Не удалось создать безопасную расстановку предметов.');
      }

      return fallbackLayout;
    }

    function setStartScreenVisible(visible) {
      if (startScreenVisible === visible) {
        return;
      }

      startScreenVisible = visible;
      startScreen.style.display = visible ? 'block' : 'none';
    }

    function syncStartScreenVisibility() {
      setStartScreenVisible(
        assetsReady && state === STATE_START && startScreen.naturalWidth > 0
      );
    }

    function clearRestartTransition() {
      restartTransitionStartedAt = 0;
      restartPausedRoundAt = 0;
      restartCoverPresented = false;
      restartLayoutPreparing = false;
      restartLayoutPrepared = false;
      restartRevealAt = 0;
      restartFailureMessage = '';
      restartFailureReturnAt = 0;
    }

    function resetRunData() {
      pears = [];
      particles = [];
      bursts = [];
      penaltyTexts = [];
      celebrationParticles = [];
      celebrationRings = [];
      celebrationStartedAt = 0;
      nextFireworkAt = 0;
      timerStartedAt = 0;
      finalElapsed = 0;
      penaltyMilliseconds = 0;
      isNewRecord = false;
      victoryPending = false;
      victoryTransitionAt = 0;
      hintCooldownUntil = 0;
      hintedPearId = null;
      hintEffectUntil = 0;
      usedHintThisRound = false;
      pageHiddenAt = 0;
    }

    function focusCanvas() {
      try {
        canvas.focus({ preventScroll: true });
      } catch {
        canvas.focus();
      }
    }

    function startGame() {
      clearRestartTransition();

      let layout;

      try {
        layout = createPearLayout();
      } catch (error) {
        console.error('Не удалось начать раунд:', error);
        audioController.playSfx('miss');
        return;
      }

      resetRunData();
      pears = layout;
      timerStartedAt = performance.now();
      state = STATE_GAME;
      syncStartScreenVisibility();
      audioController.playSfx('button');
      audioController.transitionToGame();
      focusCanvas();
    }

    function beginRestartRound() {
      if (state !== STATE_GAME || victoryPending) {
        return;
      }

      const now = performance.now();
      restartTransitionStartedAt = now;
      restartPausedRoundAt = now;
      restartCoverPresented = false;
      restartLayoutPreparing = false;
      restartLayoutPrepared = false;
      restartRevealAt = 0;
      restartFailureMessage = '';
      restartFailureReturnAt = 0;
      state = STATE_RESTARTING;

      // Старый раунд пока не уничтожается. Если генерация неожиданно завершится
      // ошибкой, можно безопасно вернуть игрока к прежней раскладке.
      audioController.playSfx('button');
      audioController.desiredMusic = 'level';
      audioController.syncDesiredMusic();
      focusCanvas();
    }

    function prepareRestartLayout(now) {
      if (
        restartLayoutPreparing ||
        restartLayoutPrepared ||
        restartFailureMessage
      ) {
        return;
      }

      restartLayoutPreparing = true;

      try {
        // Генерация транзакционная: глобальная раскладка меняется только после
        // успешного получения всех десяти валидных позиций.
        const layout = createPearLayout();
        const transitionStartedAt = restartTransitionStartedAt;
        const pausedRoundAt = restartPausedRoundAt;

        resetRunData();
        pears = layout;
        timerStartedAt = 0;

        restartTransitionStartedAt = transitionStartedAt;
        restartPausedRoundAt = pausedRoundAt;
        restartCoverPresented = true;
        restartLayoutPreparing = false;
        restartLayoutPrepared = true;
        restartRevealAt = Math.max(
          transitionStartedAt + RESTART_MIN_COVER_DURATION,
          now + RESTART_POST_LAYOUT_HOLD
        );
      } catch (error) {
        console.error('Не удалось обновить раскладку:', error);
        restartLayoutPreparing = false;
        restartFailureMessage = 'Не удалось обновить раскладку';
        restartFailureReturnAt = now + RESTART_FAILURE_HOLD;
        audioController.playSfx('miss');
      }
    }

    function finishRestartTransition(now) {
      timerStartedAt = now;
      state = STATE_GAME;
      clearRestartTransition();
      focusCanvas();
    }

    function shiftActiveRoundTimestamps(pauseStartedAt, pauseDuration) {
      if (pauseDuration <= 0) {
        return;
      }

      if (timerStartedAt > 0) {
        timerStartedAt += pauseDuration;
      }

      if (victoryPending && victoryTransitionAt > pauseStartedAt) {
        victoryTransitionAt += pauseDuration;
      }

      if (hintCooldownUntil > pauseStartedAt) {
        hintCooldownUntil += pauseDuration;
      }

      if (hintEffectUntil > pauseStartedAt) {
        hintEffectUntil += pauseDuration;
      }

      for (const pear of pears) {
        if (pear.foundAt > 0 && pear.foundAt + POP_DURATION > pauseStartedAt) {
          pear.foundAt += pauseDuration;
        }
      }

      for (const burst of bursts) {
        if (burst.createdAt + burst.duration > pauseStartedAt) {
          burst.createdAt += pauseDuration;
        }
      }

      for (const particle of particles) {
        if (particle.createdAt + particle.duration > pauseStartedAt) {
          particle.createdAt += pauseDuration;
        }
      }

      for (const penaltyText of penaltyTexts) {
        if (penaltyText.createdAt + penaltyText.duration > pauseStartedAt) {
          penaltyText.createdAt += pauseDuration;
        }
      }
    }

    function abortRestartTransition(now) {
      const pauseDuration = Math.max(0, now - restartPausedRoundAt);
      shiftActiveRoundTimestamps(restartPausedRoundAt, pauseDuration);
      state = STATE_GAME;
      clearRestartTransition();
      focusCanvas();
    }

    function scheduleVictory(now) {
      if (victoryPending) {
        return;
      }

      if (usedHintThisRound) {
        finalElapsed = 0;
        isNewRecord = false;
      } else {
        finalElapsed = Math.max(
          0,
          now - timerStartedAt + penaltyMilliseconds
        );
        isNewRecord = bestTime === null || finalElapsed < bestTime;

        if (isNewRecord) {
          bestTime = finalElapsed;
          saveBestTime(bestTime);
        }
      }

      victoryPending = true;
      victoryTransitionAt = now + VICTORY_DELAY;
    }

    function completeVictoryTransition() {
      const now = performance.now();

      clearRestartTransition();
      pears = [];
      particles = [];
      bursts = [];
      victoryPending = false;
      victoryTransitionAt = 0;
      state = STATE_END;
      initializeVictoryCelebration(now);
      syncStartScreenVisibility();
    }

    function returnToStart() {
      clearRestartTransition();
      resetRunData();
      state = STATE_START;
      syncStartScreenVisibility();
      audioController.enterStart();
    }

    function formatTime(milliseconds) {
      const total = Math.max(0, Math.floor(milliseconds));
      const minutes = Math.floor(total / 60000);
      const seconds = Math.floor((total % 60000) / 1000);
      const millis = total % 1000;

      return (
        `${String(minutes).padStart(2, '0')}:` +
        `${String(seconds).padStart(2, '0')}.` +
        `${String(millis).padStart(3, '0')}`
      );
    }

    function drawBackground(image) {
      ctx.drawImage(
        image,
        0,
        0,
        LOGICAL_WIDTH,
        LOGICAL_HEIGHT
      );
    }

    function getPopScale(pear, now) {
      if (!pear.isFound || pear.foundAt <= 0) {
        return 1;
      }

      const progress = Math.min(
        1,
        Math.max(0, (now - pear.foundAt) / POP_DURATION)
      );

      if (progress >= 1) {
        return 1;
      }

      return 1 + Math.sin(progress * Math.PI) * 0.22 * (1 - progress * 0.25);
    }

    function getHintScale(pear, now) {
      if (
        pear.isFound ||
        pear.id !== hintedPearId ||
        now >= hintEffectUntil
      ) {
        return 1;
      }

      const phase = (now / 170) * Math.PI;
      return 1.08 + Math.sin(phase) * 0.1;
    }

    function drawHintHighlight(pear, now) {
      if (
        pear.isFound ||
        pear.id !== hintedPearId ||
        now >= hintEffectUntil
      ) {
        return;
      }

      const remaining = hintEffectUntil - now;
      const fade = clamp(remaining / 260, 0, 1);
      const pulse = 0.5 + 0.5 * Math.sin(now / 115);
      const radius = Math.max(pear.width, pear.height) * (0.72 + pulse * 0.2);

      ctx.save();
      ctx.globalAlpha = fade;
      ctx.strokeStyle = '#fff36c';
      ctx.lineWidth = 7 + pulse * 4;
      ctx.shadowColor = '#fff36c';
      ctx.shadowBlur = 28;
      ctx.beginPath();
      ctx.arc(pear.x, pear.y, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawPear(pear, now) {
      const image = pear.isFound ? images.pearColor : images.pear;
      const scale = getPopScale(pear, now) * getHintScale(pear, now);

      drawHintHighlight(pear, now);

      ctx.save();
      ctx.translate(pear.x, pear.y);
      ctx.rotate(pear.angle);
      ctx.scale(
        (pear.flipX ? -1 : 1) * scale,
        (pear.flipY ? -1 : 1) * scale
      );
      ctx.drawImage(
        image,
        -pear.width / 2,
        -pear.height / 2,
        pear.width,
        pear.height
      );
      ctx.restore();
    }

    function drawStar(x, y, outerRadius, innerRadius, rotation) {
      const points = 5;
      const step = Math.PI / points;

      ctx.beginPath();

      for (let index = 0; index < points * 2; index += 1) {
        const radius = index % 2 === 0 ? outerRadius : innerRadius;
        const angle = rotation - Math.PI / 2 + index * step;
        const pointX = x + Math.cos(angle) * radius;
        const pointY = y + Math.sin(angle) * radius;

        if (index === 0) {
          ctx.moveTo(pointX, pointY);
        } else {
          ctx.lineTo(pointX, pointY);
        }
      }

      ctx.closePath();
      ctx.fill();
    }

    function spawnFindEffects(pear, now) {
      bursts.push({
        x: pear.x,
        y: pear.y,
        createdAt: now,
        duration: EFFECT_DURATION
      });

      const particleCount = 22;

      for (let index = 0; index < particleCount; index += 1) {
        const direction = randomRange(0, Math.PI * 2);
        const speed = randomRange(150, 390);

        particles.push({
          x: pear.x,
          y: pear.y,
          velocityX: Math.cos(direction) * speed,
          velocityY: Math.sin(direction) * speed - randomRange(15, 90),
          gravity: randomRange(150, 280),
          size: randomRange(5, 11),
          rotation: randomRange(0, Math.PI * 2),
          spin: randomRange(-8, 8),
          createdAt: now,
          duration: EFFECT_DURATION,
          isStar: index % 3 !== 0
        });
      }
    }

    function drawBurst(burst, now) {
      const progress = (now - burst.createdAt) / burst.duration;

      if (progress < 0 || progress >= 1) {
        return false;
      }

      const eased = 1 - Math.pow(1 - progress, 3);
      const radius = 28 + eased * 72;
      const alpha = (1 - progress) * 0.8;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#ffd75a';
      ctx.lineWidth = 8 * (1 - progress) + 2;
      ctx.shadowColor = '#fff2a0';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(burst.x, burst.y, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      return true;
    }

    function drawParticle(particle, now) {
      const ageMilliseconds = now - particle.createdAt;
      const progress = ageMilliseconds / particle.duration;

      if (progress < 0 || progress >= 1) {
        return false;
      }

      const ageSeconds = ageMilliseconds / 1000;
      const x = particle.x + particle.velocityX * ageSeconds;
      const y = particle.y +
        particle.velocityY * ageSeconds +
        particle.gravity * ageSeconds * ageSeconds / 2;
      const rotation = particle.rotation + particle.spin * ageSeconds;
      const alpha = 1 - progress;
      const scale = 0.55 + (1 - progress) * 0.75;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = progress < 0.45 ? '#fff2a0' : '#f5b82e';
      ctx.shadowColor = '#ffd75a';
      ctx.shadowBlur = 12;

      if (particle.isStar) {
        drawStar(
          x,
          y,
          particle.size * scale,
          particle.size * 0.45 * scale,
          rotation
        );
      } else {
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.fillRect(
          -particle.size * 0.22,
          -particle.size * 1.05,
          particle.size * 0.44,
          particle.size * 2.1
        );
      }

      ctx.restore();
      return true;
    }

    function drawEffects(now) {
      bursts = bursts.filter(burst => drawBurst(burst, now));
      particles = particles.filter(particle => drawParticle(particle, now));
    }

    function getCurrentElapsed(now) {
      if (victoryPending) {
        return finalElapsed;
      }

      return Math.max(
        0,
        now - timerStartedAt + penaltyMilliseconds
      );
    }

    function getFoundCount() {
      let count = 0;

      for (const pear of pears) {
        if (pear.isFound) {
          count += 1;
        }
      }

      return count;
    }

    function drawGameHud(now) {
      const timeText = usedHintThisRound
        ? 'Режим без таймера'
        : formatTime(getCurrentElapsed(now));
      const foundText = `${getFoundCount()} / ${PEAR_COUNT}`;
      const centerY = HUD_RECT.y + HUD_RECT.height / 2;

      ctx.save();
      drawRoundedRect(
        ctx,
        HUD_RECT.x,
        HUD_RECT.y,
        HUD_RECT.width,
        HUD_RECT.height,
        24
      );
      ctx.fillStyle = 'rgba(20, 28, 24, 0.44)';
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = 'rgba(241, 255, 88, 0.42)';
      ctx.stroke();

      const iconMaxWidth = 34;
      const iconMaxHeight = 48;
      const sourceWidth = images.pearColor.naturalWidth;
      const sourceHeight = images.pearColor.naturalHeight;
      const iconScale = Math.min(
        iconMaxWidth / sourceWidth,
        iconMaxHeight / sourceHeight
      );
      const iconWidth = sourceWidth * iconScale;
      const iconHeight = sourceHeight * iconScale;
      const iconCenterX = HUD_RECT.x + 40;

      ctx.drawImage(
        images.pearColor,
        iconCenterX - iconWidth / 2,
        centerY - iconHeight / 2,
        iconWidth,
        iconHeight
      );

      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.textAlign = 'left';
      ctx.font = '800 34px Arial, Helvetica, sans-serif';
      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.72)';
      ctx.strokeText(foundText, HUD_RECT.x + 72, centerY + 1);
      ctx.fillStyle = '#fff5a7';
      ctx.fillText(foundText, HUD_RECT.x + 72, centerY + 1);

      if (usedHintThisRound) {
        const badgeWidth = 300;
        const badgeHeight = 54;
        const badgeX = HUD_RECT.x + HUD_RECT.width - badgeWidth - 12;
        const badgeY = centerY - badgeHeight / 2;

        drawRoundedRect(
          ctx,
          badgeX,
          badgeY,
          badgeWidth,
          badgeHeight,
          19
        );
        ctx.fillStyle = 'rgba(255, 230, 116, 0.9)';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(86, 61, 18, 0.72)';
        ctx.stroke();
        ctx.textAlign = 'center';
        ctx.font = '800 27px Arial, Helvetica, sans-serif';
        ctx.lineWidth = 0;
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#35270e';
        ctx.fillText(
          timeText,
          badgeX + badgeWidth / 2,
          centerY + 1
        );
      } else {
        ctx.textAlign = 'right';
        ctx.font = '800 36px Arial, Helvetica, sans-serif';
        ctx.lineWidth = 7;
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.strokeText(
          timeText,
          HUD_RECT.x + HUD_RECT.width - 18,
          centerY + 1
        );
        ctx.shadowColor = 'rgba(238, 255, 92, 0.78)';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#f1ff58';
        ctx.fillText(
          timeText,
          HUD_RECT.x + HUD_RECT.width - 18,
          centerY + 1
        );
      }
      ctx.restore();
    }

    function addPenaltyText(point, now) {
      if (penaltyTexts.length >= PENALTY_TEXT_MAX_COUNT) {
        penaltyTexts.splice(
          0,
          penaltyTexts.length - PENALTY_TEXT_MAX_COUNT + 1
        );
      }

      penaltyTexts.push({
        x: clamp(point.x, 120, LOGICAL_WIDTH - 120),
        y: clamp(point.y, 90, LOGICAL_HEIGHT - 55),
        createdAt: now,
        duration: PENALTY_TEXT_DURATION
      });
    }

    function drawPenaltyText(item, now) {
      const progress = (now - item.createdAt) / item.duration;

      if (progress < 0 || progress >= 1) {
        return false;
      }

      const eased = 1 - Math.pow(1 - progress, 3);
      const y = item.y - eased * 78;
      const alpha = 1 - progress;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '900 42px Arial, Helvetica, sans-serif';
      ctx.lineWidth = 9;
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(55, 0, 0, 0.88)';
      ctx.strokeText('+3 сек!', item.x, y);
      ctx.fillStyle = '#ff5555';
      ctx.shadowColor = 'rgba(255, 40, 40, 0.72)';
      ctx.shadowBlur = 14;
      ctx.fillText('+3 сек!', item.x, y);
      ctx.restore();
      return true;
    }

    function drawPenaltyTexts(now) {
      penaltyTexts = penaltyTexts.filter(item => drawPenaltyText(item, now));
    }

    const FIREWORK_COLORS = Object.freeze([
      '#ffd45a',
      '#fff3ad',
      '#ff8bbd',
      '#8fe9ff',
      '#a8ff9c',
      '#d6a3ff'
    ]);

    function trimCelebrationObjects() {
      if (celebrationParticles.length > FIREWORK_MAX_PARTICLES) {
        celebrationParticles.splice(
          0,
          celebrationParticles.length - FIREWORK_MAX_PARTICLES
        );
      }

      if (celebrationRings.length > FIREWORK_MAX_RINGS) {
        celebrationRings.splice(
          0,
          celebrationRings.length - FIREWORK_MAX_RINGS
        );
      }
    }

    function spawnVictoryFirework(createdAt, x = null, y = null) {
      const centerX = x ?? randomRange(
        LOGICAL_WIDTH * 0.34,
        LOGICAL_WIDTH * 0.66
      );
      const centerY = y ?? randomRange(
        LOGICAL_HEIGHT * 0.22,
        LOGICAL_HEIGHT * 0.58
      );
      const color = FIREWORK_COLORS[
        Math.floor(Math.random() * FIREWORK_COLORS.length)
      ];
      const remainingSlots = Math.max(
        0,
        FIREWORK_MAX_PARTICLES - celebrationParticles.length
      );
      const particleCount = Math.min(
        FIREWORK_PARTICLES_PER_BURST,
        remainingSlots
      );

      if (particleCount <= 0) {
        return;
      }

      const rotationOffset = randomRange(0, Math.PI * 2);

      celebrationRings.push({
        x: centerX,
        y: centerY,
        color,
        createdAt,
        duration: 520
      });

      for (let index = 0; index < particleCount; index += 1) {
        const direction =
          rotationOffset +
          index / particleCount * Math.PI * 2 +
          randomRange(-0.075, 0.075);
        const speed = randomRange(165, 335);
        const lifeScale = randomRange(0.86, 1.08);

        celebrationParticles.push({
          x: centerX,
          y: centerY,
          velocityX: Math.cos(direction) * speed,
          velocityY: Math.sin(direction) * speed,
          gravity: randomRange(110, 165),
          size: randomRange(2.6, 5.2),
          color,
          createdAt,
          duration: FIREWORK_PARTICLE_DURATION * lifeScale,
          twinkleOffset: randomRange(0, Math.PI * 2)
        });
      }

      trimCelebrationObjects();
    }

    function initializeVictoryCelebration(now) {
      celebrationParticles = [];
      celebrationRings = [];
      celebrationStartedAt = now;
      nextFireworkAt = now + 1450;

      const initialBursts = [
        { x: LOGICAL_WIDTH * 0.38, y: LOGICAL_HEIGHT * 0.36, delay: 0 },
        { x: LOGICAL_WIDTH * 0.62, y: LOGICAL_HEIGHT * 0.32, delay: 180 },
        { x: LOGICAL_WIDTH * 0.5, y: LOGICAL_HEIGHT * 0.22, delay: 380 }
      ];

      for (
        let index = 0;
        index < Math.min(FIREWORK_INITIAL_BURSTS, initialBursts.length);
        index += 1
      ) {
        const burst = initialBursts[index];

        spawnVictoryFirework(
          now + burst.delay,
          burst.x,
          burst.y
        );
      }
    }

    function drawVictoryRing(ring, now) {
      const progress = (now - ring.createdAt) / ring.duration;

      if (progress < 0) {
        return true;
      }

      if (progress >= 1) {
        return false;
      }

      const eased = 1 - Math.pow(1 - progress, 3);
      const radius = 18 + eased * 70;

      ctx.globalAlpha = (1 - progress) * 0.72;
      ctx.strokeStyle = ring.color;
      ctx.lineWidth = 5.5 * (1 - progress) + 1.2;
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, radius, 0, Math.PI * 2);
      ctx.stroke();

      return true;
    }

    function drawVictoryParticle(particle, now) {
      const ageMilliseconds = now - particle.createdAt;

      if (ageMilliseconds < 0) {
        return true;
      }

      const progress = ageMilliseconds / particle.duration;

      if (progress >= 1) {
        return false;
      }

      const ageSeconds = ageMilliseconds / 1000;
      const drag = 1 - progress * 0.2;
      const x = particle.x + particle.velocityX * ageSeconds * drag;
      const y =
        particle.y +
        particle.velocityY * ageSeconds * drag +
        particle.gravity * ageSeconds * ageSeconds / 2;
      const previousAge = Math.max(0, ageSeconds - 0.026);
      const previousX =
        particle.x +
        particle.velocityX * previousAge * drag;
      const previousY =
        particle.y +
        particle.velocityY * previousAge * drag +
        particle.gravity * previousAge * previousAge / 2;
      const fade = Math.pow(1 - progress, 1.25);
      const twinkle =
        0.78 +
        Math.sin(progress * 16 + particle.twinkleOffset) * 0.22;

      ctx.globalAlpha = fade * twinkle;
      ctx.strokeStyle = particle.color;
      ctx.lineCap = 'round';
      ctx.lineWidth = Math.max(1.2, particle.size * (1 - progress * 0.5));
      ctx.beginPath();
      ctx.moveTo(previousX, previousY);
      ctx.lineTo(x, y);
      ctx.stroke();

      return true;
    }

    function drawVictoryFireworks(now) {
      const celebrationAge = now - celebrationStartedAt;
      const canSpawnMore = celebrationAge < FIREWORK_SEQUENCE_DURATION;

      if (
        nextFireworkAt <= 0 ||
        now - nextFireworkAt > FIREWORK_SPAWN_INTERVAL * 2
      ) {
        nextFireworkAt = now + FIREWORK_SPAWN_INTERVAL;
      }

      let spawnedThisFrame = 0;

      while (
        canSpawnMore &&
        now >= nextFireworkAt &&
        spawnedThisFrame < FIREWORK_MAX_SPAWNS_PER_FRAME
      ) {
        spawnVictoryFirework(nextFireworkAt);
        nextFireworkAt += FIREWORK_SPAWN_INTERVAL;
        spawnedThisFrame += 1;
      }

      if (canSpawnMore && now >= nextFireworkAt) {
        nextFireworkAt = now + FIREWORK_SPAWN_INTERVAL;
      }

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      celebrationRings = celebrationRings.filter(
        ring => drawVictoryRing(ring, now)
      );
      celebrationParticles = celebrationParticles.filter(
        particle => drawVictoryParticle(particle, now)
      );
      ctx.restore();
    }

    function createBlurredEndBackgroundCache() {
      const width = 960;
      const height = 540;
      const cache = document.createElement('canvas');
      cache.width = width;
      cache.height = height;
      const cacheContext = cache.getContext('2d', { alpha: false });

      if (!cacheContext) {
        blurredEndBackgroundCanvas = null;
        return;
      }

      cacheContext.imageSmoothingEnabled = true;
      cacheContext.imageSmoothingQuality = 'high';

      try {
        cacheContext.filter = 'blur(8px) brightness(0.58) saturate(0.82)';
      } catch {
        cacheContext.filter = 'none';
      }

      cacheContext.drawImage(
        images.end,
        -12,
        -12,
        width + 24,
        height + 24
      );
      cacheContext.filter = 'none';
      blurredEndBackgroundCanvas = cache;
    }

    function drawBlurredEndBackground() {
      if (!blurredEndBackgroundCanvas) {
        createBlurredEndBackgroundCache();
      }

      ctx.save();
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      if (blurredEndBackgroundCanvas) {
        ctx.drawImage(
          blurredEndBackgroundCanvas,
          0,
          0,
          LOGICAL_WIDTH,
          LOGICAL_HEIGHT
        );
      } else {
        ctx.drawImage(
          images.end,
          0,
          0,
          LOGICAL_WIDTH,
          LOGICAL_HEIGHT
        );
        ctx.fillStyle = 'rgba(8, 3, 14, 0.44)';
        ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
      }

      ctx.restore();

      ctx.save();
      const vignette = ctx.createRadialGradient(
        LOGICAL_WIDTH / 2,
        LOGICAL_HEIGHT / 2,
        120,
        LOGICAL_WIDTH / 2,
        LOGICAL_HEIGHT / 2,
        920
      );
      vignette.addColorStop(0, 'rgba(20, 9, 26, 0.08)');
      vignette.addColorStop(1, 'rgba(8, 3, 14, 0.66)');
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
      ctx.restore();
    }

    function drawVictoryMessage(now) {
      const elapsed = Math.max(0, now - celebrationStartedAt);
      const appearProgress = clamp(elapsed / 520, 0, 1);
      const eased = 1 - Math.pow(1 - appearProgress, 3);
      const panelWidth = 1120;
      const panelHeight = 570;
      const panelX = (LOGICAL_WIDTH - panelWidth) / 2;
      const panelY = 250;
      const pulse = 1 + Math.sin(elapsed / 360) * 0.008;

      ctx.save();
      ctx.translate(LOGICAL_WIDTH / 2, panelY + panelHeight / 2);
      ctx.scale(pulse, pulse);
      ctx.translate(-LOGICAL_WIDTH / 2, -(panelY + panelHeight / 2));
      ctx.globalAlpha = eased;

      drawRoundedRect(
        ctx,
        panelX,
        panelY,
        panelWidth,
        panelHeight,
        54
      );
      ctx.fillStyle = 'rgba(25, 13, 29, 0.68)';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(255, 225, 117, 0.82)';
      ctx.shadowColor = 'rgba(255, 207, 72, 0.42)';
      ctx.shadowBlur = 28;
      ctx.stroke();

      if (isNewRecord) {
        const recordPulse = 1 + Math.sin(elapsed / 150) * 0.045;
        const badgeWidth = 610;
        const badgeHeight = 82;
        const badgeX = (LOGICAL_WIDTH - badgeWidth) / 2;
        const badgeY = panelY - 58;

        ctx.save();
        ctx.translate(LOGICAL_WIDTH / 2, badgeY + badgeHeight / 2);
        ctx.scale(recordPulse, recordPulse);
        ctx.translate(-LOGICAL_WIDTH / 2, -(badgeY + badgeHeight / 2));
        drawRoundedRect(
          ctx,
          badgeX,
          badgeY,
          badgeWidth,
          badgeHeight,
          34
        );
        ctx.fillStyle = 'rgba(127, 53, 20, 0.96)';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#ffe889';
        ctx.stroke();
        ctx.font = '900 42px Arial, Helvetica, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff4a8';
        ctx.shadowColor = 'rgba(255, 214, 72, 0.75)';
        ctx.shadowBlur = 16;
        ctx.fillText(
          '🎉 НОВЫЙ РЕКОРД!',
          LOGICAL_WIDTH / 2,
          badgeY + badgeHeight / 2 + 1
        );
        ctx.restore();
      }

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';

      ctx.font = '900 82px Arial, Helvetica, sans-serif';
      ctx.lineWidth = 14;
      ctx.strokeStyle = 'rgba(62, 29, 44, 0.96)';
      ctx.strokeText(
        'УРОВЕНЬ ПРОЙДЕН!',
        LOGICAL_WIDTH / 2,
        panelY + 105
      );
      ctx.fillStyle = '#fff1a8';
      ctx.fillText(
        'УРОВЕНЬ ПРОЙДЕН!',
        LOGICAL_WIDTH / 2,
        panelY + 105
      );

      ctx.shadowBlur = 0;
      ctx.font = '700 36px Arial, Helvetica, sans-serif';
      ctx.fillStyle = '#fff9df';
      ctx.fillText(
        'Все 10 груш найдены — вы молодец!',
        LOGICAL_WIDTH / 2,
        panelY + 190
      );

      if (usedHintThisRound) {
        ctx.font = '800 40px Arial, Helvetica, sans-serif';
        ctx.fillStyle = '#f1ff58';
        ctx.shadowColor = 'rgba(238, 255, 92, 0.5)';
        ctx.shadowBlur = 10;
        ctx.fillText(
          'Уровень пройден (с подсказкой)',
          LOGICAL_WIDTH / 2,
          panelY + 292
        );

        ctx.shadowBlur = 0;
        ctx.font = '700 31px Arial, Helvetica, sans-serif';
        ctx.fillStyle = '#fff6c9';
        ctx.fillText(
          'Таймер отключён — рекорд не обновлён',
          LOGICAL_WIDTH / 2,
          panelY + 355
        );

        if (bestTime !== null) {
          ctx.font = '600 28px Arial, Helvetica, sans-serif';
          ctx.fillStyle = 'rgba(255, 249, 223, 0.82)';
          ctx.fillText(
            `Сохранённый рекорд: ${formatTime(bestTime)}`,
            LOGICAL_WIDTH / 2,
            panelY + 407
          );
        }
      } else {
        ctx.font = '800 40px Arial, Helvetica, sans-serif';
        ctx.fillStyle = '#f1ff58';
        ctx.shadowColor = 'rgba(238, 255, 92, 0.55)';
        ctx.shadowBlur = 12;
        ctx.fillText(
          `Время раунда: ${formatTime(finalElapsed)}`,
          LOGICAL_WIDTH / 2,
          panelY + 292
        );

        ctx.shadowBlur = 0;
        ctx.font = '700 35px Arial, Helvetica, sans-serif';
        ctx.fillStyle = '#fff6c9';
        ctx.fillText(
          `Лучшее время: ${formatTime(bestTime ?? finalElapsed)}`,
          LOGICAL_WIDTH / 2,
          panelY + 365
        );
      }

      ctx.font = '600 29px Arial, Helvetica, sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.84)';
      ctx.fillText(
        'Нажмите на экран, чтобы вернуться на старт',
        LOGICAL_WIDTH / 2,
        panelY + 478
      );

      ctx.restore();
    }

    function drawVictoryScreen(now) {
      drawBlurredEndBackground();
      drawVictoryFireworks(now);
      drawVictoryMessage(now);
    }

    function showVolumeHud() {
      volumeHudVisibleUntil = performance.now() + VOLUME_HUD_DURATION;
    }

    function drawRoundedRect(context, x, y, width, height, radius) {
      const safeRadius = Math.min(radius, width / 2, height / 2);

      context.beginPath();
      context.moveTo(x + safeRadius, y);
      context.arcTo(x + width, y, x + width, y + height, safeRadius);
      context.arcTo(
        x + width,
        y + height,
        x,
        y + height,
        safeRadius
      );
      context.arcTo(x, y + height, x, y, safeRadius);
      context.arcTo(x, y, x + width, y, safeRadius);
      context.closePath();
    }

    function drawSpeakerIcon(context, centerX, centerY, size, muted) {
      const half = size / 2;
      const left = centerX - half;
      const top = centerY - half;

      context.save();
      context.lineCap = 'round';
      context.lineJoin = 'round';
      context.strokeStyle = '#fff6b3';
      context.fillStyle = '#fff6b3';
      context.lineWidth = Math.max(4, size * 0.075);
      context.shadowColor = 'rgba(255, 214, 72, 0.65)';
      context.shadowBlur = 10;

      context.beginPath();
      context.rect(left + size * 0.12, top + size * 0.36, size * 0.2, size * 0.28);
      context.fill();

      context.beginPath();
      context.moveTo(left + size * 0.31, top + size * 0.36);
      context.lineTo(left + size * 0.58, top + size * 0.16);
      context.lineTo(left + size * 0.58, top + size * 0.84);
      context.lineTo(left + size * 0.31, top + size * 0.64);
      context.closePath();
      context.fill();

      if (muted) {
        context.beginPath();
        context.moveTo(left + size * 0.68, top + size * 0.34);
        context.lineTo(left + size * 0.9, top + size * 0.66);
        context.moveTo(left + size * 0.9, top + size * 0.34);
        context.lineTo(left + size * 0.68, top + size * 0.66);
        context.stroke();
      } else {
        context.beginPath();
        context.arc(
          left + size * 0.57,
          centerY,
          size * 0.2,
          -Math.PI / 3,
          Math.PI / 3
        );
        context.stroke();

        context.beginPath();
        context.arc(
          left + size * 0.57,
          centerY,
          size * 0.34,
          -Math.PI / 3,
          Math.PI / 3
        );
        context.stroke();
      }

      context.restore();
    }

    function drawMuteButton() {
      if (state !== STATE_START) {
        return;
      }

      const rect = MUTE_BUTTON_RECT;
      const muted = audioController.isEffectivelyMuted;

      hudCtx.save();
      drawRoundedRect(
        hudCtx,
        rect.x,
        rect.y,
        rect.width,
        rect.height,
        26
      );
      hudCtx.fillStyle = 'rgba(18, 23, 21, 0.68)';
      hudCtx.fill();
      hudCtx.lineWidth = 3;
      hudCtx.strokeStyle = 'rgba(255, 245, 166, 0.72)';
      hudCtx.stroke();
      hudCtx.restore();

      drawSpeakerIcon(
        hudCtx,
        rect.x + rect.width / 2,
        rect.y + rect.height / 2,
        70,
        muted
      );
    }

    function drawVolumePopup(now) {
      if (now >= volumeHudVisibleUntil) {
        return;
      }

      const remaining = volumeHudVisibleUntil - now;
      const alpha = remaining < VOLUME_HUD_FADE_DURATION
        ? remaining / VOLUME_HUD_FADE_DURATION
        : 1;
      const percent = Math.round(audioController.globalVolume * 100);
      const text = `Громкость: ${percent}%`;
      const width = 520;
      const height = 84;
      const x = (LOGICAL_WIDTH - width) / 2;
      const y = 36;

      hudCtx.save();
      hudCtx.globalAlpha = clamp(alpha, 0, 1);
      drawRoundedRect(hudCtx, x, y, width, height, 28);
      hudCtx.fillStyle = 'rgba(16, 22, 19, 0.82)';
      hudCtx.fill();
      hudCtx.lineWidth = 3;
      hudCtx.strokeStyle = 'rgba(255, 235, 112, 0.8)';
      hudCtx.stroke();

      hudCtx.font = '700 34px Arial, Helvetica, sans-serif';
      hudCtx.textAlign = 'left';
      hudCtx.textBaseline = 'middle';
      hudCtx.fillStyle = '#fff4a8';
      hudCtx.shadowColor = 'rgba(255, 214, 72, 0.6)';
      hudCtx.shadowBlur = 9;
      hudCtx.fillText(text, x + 116, y + height / 2 + 1);
      hudCtx.restore();

      hudCtx.save();
      hudCtx.globalAlpha = clamp(alpha, 0, 1);
      drawSpeakerIcon(
        hudCtx,
        x + 68,
        y + height / 2,
        48,
        audioController.isEffectivelyMuted
      );
      hudCtx.restore();
    }

    function drawStartBestTime() {
      if (state !== STATE_START || bestTime === null || !assetsReady) {
        return;
      }

      const width = 470;
      const height = 72;
      const x = LOGICAL_WIDTH - width - 30;
      const y = 28;

      hudCtx.save();
      drawRoundedRect(hudCtx, x, y, width, height, 26);
      hudCtx.fillStyle = 'rgba(16, 22, 19, 0.76)';
      hudCtx.fill();
      hudCtx.lineWidth = 3;
      hudCtx.strokeStyle = 'rgba(255, 235, 112, 0.76)';
      hudCtx.stroke();
      hudCtx.font = '800 34px Arial, Helvetica, sans-serif';
      hudCtx.textAlign = 'center';
      hudCtx.textBaseline = 'middle';
      hudCtx.fillStyle = '#fff4a8';
      hudCtx.shadowColor = 'rgba(255, 214, 72, 0.55)';
      hudCtx.shadowBlur = 9;
      hudCtx.fillText(
        `Рекорд: ${formatTime(bestTime)}`,
        x + width / 2,
        y + height / 2 + 1
      );
      hudCtx.restore();
    }

    function drawBulbIcon(context, centerX, centerY, size, disabled) {
      context.save();
      context.lineCap = 'round';
      context.lineJoin = 'round';
      context.strokeStyle = disabled ? '#9d9d86' : '#fff36c';
      context.fillStyle = disabled ? '#777768' : '#fff36c';
      context.lineWidth = Math.max(4, size * 0.08);
      context.shadowColor = disabled ? 'transparent' : '#fff36c';
      context.shadowBlur = disabled ? 0 : 14;
      context.beginPath();
      context.arc(centerX, centerY - size * 0.1, size * 0.27, Math.PI * 0.15, Math.PI * 0.85, true);
      context.quadraticCurveTo(
        centerX - size * 0.23,
        centerY + size * 0.16,
        centerX - size * 0.12,
        centerY + size * 0.27
      );
      context.lineTo(centerX + size * 0.12, centerY + size * 0.27);
      context.quadraticCurveTo(
        centerX + size * 0.23,
        centerY + size * 0.16,
        centerX + size * 0.27,
        centerY - size * 0.1
      );
      context.fill();
      context.beginPath();
      context.moveTo(centerX - size * 0.13, centerY + size * 0.36);
